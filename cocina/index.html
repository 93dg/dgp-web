<style>

.paso2{background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin:8px 0;overflow:hidden}.paso2.act{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.paso2.hecho{opacity:.6}

.paso2 .cab span{flex:1}.paso2 .cab small{display:block;color:var(--mut);font-size:.8rem}.paso2 .cab em{color:var(--mut);font-style:normal}.paso2 .cue{padding:0 14px 14px}.paso2 .cue>div{padding:4px 0}
.tmr b{font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:70px}.fin{margin-top:6px;padding:8px 10px;border:1px solid var(--ac);border-radius:10px}
.seg.sub button{font-size:.72rem;padding:0 1px;min-width:0}
.ln2{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.ln2>span{flex:1}.ln2.sub{padding-left:10px;color:var(--mut);font-size:.9rem}.ln2 input{width:84px;min-height:36px;padding:4px 8px;text-align:center}
.ord{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}.ord i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);font-style:normal;text-align:center;font-size:.78rem;line-height:22px}.ord span{flex:1}
.fase{display:inline-block;font-style:normal;font-size:.72rem;border-radius:999px;padding:0 8px;margin-left:4px;border:1px solid var(--bd);color:var(--mut)}.fase.antes{border-color:var(--ac);color:var(--ac)}.fase.despues{border-color:var(--pos);color:var(--pos)}
.menu{border-bottom:1px solid var(--bd)}.mrow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 2px;cursor:pointer}.mrow .mt{flex:1;min-width:0}.mrow b{display:block;font-size:1.1rem}.mrow .d{display:block;color:var(--mut);margin-top:2px}.mrow .meta{display:block;margin-top:4px}
.th{flex:0 0 118px;background:#f1eee8;border-radius:14px;padding:4px;border:1px solid var(--bd)}.th .pzsvg{display:block;width:100%;height:auto}.big{background:#f1eee8;border-radius:16px;padding:8px;margin:2px 0 6px}.big .pzsvg{display:block;width:100%;height:auto}.mdet{padding:0 2px 14px}

.tsel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0}
.cm{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd);font-size:1.12rem;cursor:pointer}.cm .bx{flex:0 0 30px;height:30px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#000}.cm.hecho{opacity:.45}.cm.hecho span{text-decoration:line-through}.cm.hecho .bx{background:var(--pos);border-color:var(--pos)}
.cmh{margin:12px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}.cmh.sep{margin:14px 0 6px;padding:8px 10px;border:1px dashed var(--ac);border-radius:10px;color:var(--ac);text-align:center}
.dia{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.dia b{font-size:.9rem}.dia select{min-height:40px;padding:6px 8px;font-size:.85rem}
</style>

<body>
<div class="top">
  <div class="tabs" id="tabs">
    <button data-v="rec" class="on">Recetas</button><button data-v="menu">Menú</button><button data-v="compra">Compra</button><button data-v="desp">Despensa</button><button data-v="nota">Notas</button><button data-v="pizza">Pizza</button>

  <div class="bus" id="bus"><input id="q" type="search" placeholder="Buscar nombre, ingrediente, etiqueta…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<button class="fab pri" id="fab" aria-label="Añadir">+</button>
<div class="sheet" id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const URL0='https://qtnqupcfgooazjzkpmtx.supabase.co', KEY='sb_publishable_brvDWgh8e_IrS8NWDvt7xg_rbL2dqcd';
const sbc=window.supabase?window.supabase.createClient(URL0,KEY):null;
async function cab(){ try{ if(!sbc) return null; const {data:{session}}=await sbc.auth.getSession(); return session?{apikey:KEY,Authorization:'Bearer '+session.access_token}:null; }catch(e){ return null; } }
let R=[], U={compra:[],desp:[],menu:{}}, V='rec', Q='', TAG='', conSesion=true, cargado=false;
try{ R=JSON.parse(localStorage.getItem('dgp-cocina')||'[]'); U=Object.assign(U,JSON.parse(localStorage.getItem('dgp-cocina-u')||'{}')); V=localStorage.getItem('dgp-cocina-v')||'rec'; }catch(e){}
function cache(){ try{ localStorage.setItem('dgp-cocina',JSON.stringify(R)); localStorage.setItem('dgp-cocina-u',JSON.stringify(U)); }catch(e){} }
/* ---------- servidor ---------- */
async function api(path,opt){ const H=await cab(); if(!H){ conSesion=false; return null; } opt=opt||{};
  const h=Object.assign({'Accept-Profile':'personal','Content-Profile':'personal','Content-Type':'application/json'},H,opt.h||{});
  try{ const r=await fetch(URL0+'/rest/v1/'+path,{method:opt.m||'GET',headers:h,body:opt.b?JSON.stringify(opt.b):undefined}); if(!r.ok) return null; const t=await r.text(); return t?JSON.parse(t):[]; }catch(e){ return null; } }
async function cargar(){
  const a=await api('recetas?select=*&order=titulo.asc'); if(a){ R=a; conSesion=true; }
  const u=await api('ui_estado?clave=in.(cocina_compra,cocina_despensa,cocina_menu)&select=clave,valor');
  if(u){ u.forEach(x=>{ if(x.clave==='cocina_compra') U.compra=x.valor||[]; if(x.clave==='cocina_despensa') U.desp=x.valor||[]; if(x.clave==='cocina_menu') U.menu=x.valor||{}; }); }
  cargado=true; cache(); pintar(); }
const tU={}; function guardaU(k){ cache(); clearTimeout(tU[k]); tU[k]=setTimeout(()=>{ const clave={compra:'cocina_compra',desp:'cocina_despensa',menu:'cocina_menu'}[k];
  api('ui_estado?on_conflict=clave',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{clave,valor:U[k],actualizado:new Date().toISOString()}}); },500); }
async function guardaR(r){ r.actualizado=new Date().toISOString(); const cuerpo={tipo:r.tipo,titulo:r.titulo,etiquetas:r.etiquetas,raciones:r.raciones,tiempo:r.tiempo,ingredientes:r.ingredientes,pasos:r.pasos,notas:r.notas,fav:!!r.fav,actualizado:r.actualizado};
  if(r.id){ const i=R.findIndex(x=>x.id===r.id); if(i>=0) R[i]=r; cache(); await api('recetas?id=eq.'+r.id,{m:'PATCH',b:cuerpo,h:{Prefer:'return=minimal'}}); return r; }
  const a=await api('recetas',{m:'POST',b:cuerpo,h:{Prefer:'return=representation'}}); if(a&&a[0]){ R.push(a[0]); cache(); return a[0]; }
  r.id='local-'+Date.now(); R.push(r); cache(); return r; }
async function borraR(id){ R=R.filter(x=>x.id!==id); cache(); await api('recetas?id=eq.'+id,{m:'DELETE',h:{Prefer:'return=minimal'}}); }
/* ---------- utilidades ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const lineas=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3};
function fmt(n){ const r=Math.round(n*100)/100; return String(r).replace('.',','); }
function escala(l,f){ if(f===1) return l; return l.replace(/^(\s*[-•*·]?\s*)(\d+\s*\/\s*\d+|\d+[.,]\d+|\d+|[½¼¾⅓])/,(m,p,n)=>{ let v; if(FR[n]!=null) v=FR[n]; else if(n.includes('/')){ const [a,b]=n.split('/'); v=a/b; } else v=parseFloat(n.replace(',','.')); return p+fmt(v*f); }); }
const AUTO=[['postre','postre|tarta|flan|natillas|bizcocho|helado|brownie|galleta|tiramis'],['carne','pollo|ternera|cerdo|cordero|carne|hamburguesa|solomillo|costilla'],['pescado','pescado|merluza|salm[oó]n|bacalao|at[uú]n|gamba|marisco|pulpo'],['pasta','pasta|espagueti|macarron|lasa[ñn]a|tallarines'],['arroz','arroz|paella|risotto'],['verdura','verdura|ensalada|calabac[ií]n|berenjena|espinaca|br[oó]coli'],['sopa','sopa|crema de|caldo|gazpacho'],['legumbres','lentejas|garbanzos|alubias|judías'],['pan','pan |masa|focaccia|pizza']];
function autoTags(t){ const n=norm(t); return AUTO.filter(a=>new RegExp(a[1].normalize('NFD').replace(/[̀-ͯ]/g,'')).test(n)).map(a=>a[0]); }
const H_ING=/^(ingredientes?|ingredients?)\s*:?$/i, H_PAS=/^(preparaci[oó]n|pasos|elaboraci[oó]n|instrucciones|procedimiento|modo de hacer|m[eé]todo)\s*:?$/i;
function parseNota(txt){ const L=String(txt).split('\n').map(x=>x.replace(/\s+$/,'')); while(L.length&&!L[0].trim()) L.shift(); if(!L.length) return null;
  const titulo=L.shift().replace(/^[#*\s]+|[#*\s]+$/g,'').slice(0,160)||'Sin título'; let ing=[],pas=[],otros=[],modo='';
  const hay=L.some(x=>H_ING.test(x.trim())||H_PAS.test(x.trim()));
  L.forEach(x=>{ const t=x.trim(); if(!t) return;
    if(H_ING.test(t)){ modo='i'; return; } if(H_PAS.test(t)){ modo='p'; return; }
    if(hay){ if(modo==='i') ing.push(t); else if(modo==='p') pas.push(t); else otros.push(t); }
    else { if(t.length<70&&(/^[-•*·]/.test(t)||/^\d/.test(t)||/\b(g|kg|ml|l|cucharada|cucharadita|taza|vaso|pizca|diente|unidad|ud)\b/i.test(t))) ing.push(t); else pas.push(t); } });
  const rac=(txt.match(/(\d+)\s*(raciones|personas|comensales)/i)||[])[1];
  return {tipo:'receta',titulo,etiquetas:autoTags(txt),raciones:rac?+rac:null,tiempo:'',ingredientes:ing.join('\n'),pasos:pas.join('\n'),notas:otros.join('\n'),fav:false}; }
/* ---------- pintar ---------- */
function filtradas(tipo){ const q=norm(Q).split(/\s+/).filter(Boolean);
  return R.filter(r=>(r.tipo||'receta')===tipo).filter(r=>!TAG||(TAG==='★'?r.fav:(r.etiquetas||[]).includes(TAG))).filter(r=>{ if(!q.length) return true; const h=norm([r.titulo,(r.etiquetas||[]).join(' '),r.ingredientes,r.notas].join(' ')); return q.every(w=>h.includes(w)); }).sort((a,b)=>a.titulo.localeCompare(b.titulo,'es')); }
function pintar(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
  const lista=V==='rec'||V==='nota'; $('bus').hidden=!lista; $('chips').hidden=!lista; $('fab').hidden=!(lista); try{ localStorage.setItem('dgp-cocina-v',V); }catch(e){}
  let h='';
  if(!conSesion&&!R.length) h+='<div class="aviso">Para ver y guardar tus recetas entra primero en el hub (DGP) con tu sesión y vuelve aquí.<br><br><a href="../" style="color:var(--ac)">Abrir DGP</a></div>';
  if(lista){ const tipo=V==='rec'?'receta':'nota'; const todas=R.filter(r=>(r.tipo||'receta')===tipo); const tags=[...new Set(todas.flatMap(r=>r.etiquetas||[]))].sort((a,b)=>a.localeCompare(b,'es'));
    $('chips').innerHTML=(todas.some(r=>r.fav)?'<button class="chip'+(TAG==='★'?' on':'')+'" data-t="★">★</button>':'')+tags.map(t=>'<button class="chip'+(TAG===t?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('');
    const f=filtradas(tipo);
    h+=f.length?'<div class="grid">'+f.map(r=>'<div class="card" data-id="'+esc(r.id)+'"><b>'+(r.fav?'★ ':'')+esc(r.titulo)+'</b><div class="meta">'+[r.tiempo,r.raciones?r.raciones+' raciones':''].filter(Boolean).map(esc).join(' · ')+'</div>'+(r.etiquetas||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>').join('')+'</div>':'<div class="vacio">'+(todas.length?'Nada que coincida.':(cargado?'Aún no hay nada. Toca + para pegar una nota.':'Cargando…'))+'</div>'; }
  else if(V==='compra'||V==='desp') h+=pintaLista(V);
  else if(V==='menu') h+=pintaMenu();
  else if(V==='pizza') h+=pintaPizza();
  $('main').innerHTML=h; if(V==='pizza') calcPizza(); }
function pintaLista(k){ const L=U[k]; return '<div class="fila" style="margin-bottom:8px"><input id="nuevoI" placeholder="'+(k==='compra'?'Añadir a la compra':'Añadir a la despensa')+'" autocomplete="off" style="flex:1"><button class="pri" id="addI" data-k="'+k+'">+</button></div>'+
  (L.length?L.map((x,i)=>'<div class="item'+(x.ok?' ok':'')+'"><input type="checkbox" data-k="'+k+'" data-i="'+i+'"'+(x.ok?' checked':'')+'><span>'+esc(x.t)+'</span></div>').join(''):'<div class="vacio">Vacía.</div>')+
  '<div class="fila" style="margin-top:12px"><button data-quita="'+k+'">Quitar marcados</button><button data-copia="'+k+'">Copiar lista</button>'+(k==='compra'?'<button data-despensa="1">Marcados → despensa</button>':'')+'</div>'; }
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
function pintaMenu(){ const recs=R.filter(r=>(r.tipo||'receta')==='receta').sort((a,b)=>a.titulo.localeCompare(b.titulo,'es')); const op=v=>'<option value="">—</option>'+recs.map(r=>'<option value="'+esc(r.id)+'"'+(v===r.id?' selected':'')+'>'+esc(r.titulo)+'</option>').join('');
  return DIAS.map((d,i)=>'<div class="dia"><b>'+d.slice(0,3)+'</b><select data-m="'+i+'c">'+op((U.menu[i+'c']))+'</select><select data-m="'+i+'n">'+op((U.menu[i+'n']))+'</select></div>').join('')+'<div class="meta" style="margin:6px 0">Primera columna comida, segunda cena.</div><div class="fila"><button class="pri" id="menuCompra">Ingredientes de la semana → compra</button><button id="menuBorra">Vaciar menú</button></div>'; }
/* ---------- calculadora de pizza ---------- */
const PZ_SAL=0.0286, PZ_LEV={24:0.08,48:0.048,72:0.032};
let PZ={n:2,g:250,h:62,t:48}; try{ Object.assign(PZ,JSON.parse(localStorage.getItem('dgp-cocina-pz')||'{}')); }catch(e){}
const f0=n=>String(Math.round(n)), f1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',','), f2=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');

  if(b.dataset.mk==='clear'){ TS.sel=[]; guardaTS(); pintar(); return; }
  if(b.dataset.mk==='now'){ PZTMP=buildCustom('tmp',TS.nombre||'Pizza a medida'); guardaTS(); hacer('tmp'); return; }
  if(b.dataset.mk==='save'){ const q=buildCustom('c'+Date.now(),TS.nombre||('Pizza a medida '+(PZC.length+1))); PZC.push(q); guardaTS(); b.textContent='✓ Guardada en Pizzas'; return; }
  if(b.dataset.pdel){ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='¿Seguro?'; return; } PZC=PZC.filter(x=>x.id!==b.dataset.pdel); delete PZP[b.dataset.pdel]; if(PZSEL===b.dataset.pdel&&!esBase(PZSEL)) PZSEL='kebab'; guardaTS(); guardaPZP(); pintar(); return; }
  if(b.dataset.bkr){ delete PZP[b.dataset.bkr]; guardaPZP(); pintar(); return; }
  if(b.dataset.dn!==undefined){ const i=+b.dataset.dn; EL.done[i]=!EL.done[i]; EL.open[i]=false; const P=pasosEL(), nx=P.findIndex((_,k)=>!EL.done[k]); if(nx>=0) EL.open[nx]=true; guardaEL(); pintar(); return; }
  if(b.dataset.tg){ const n=+b.dataset.tg, t=TM[n]||(TM[n]={run:false,rem:DUR[n],end:0}); if(t.run){ t.rem=(t.end-Date.now())/1000; t.run=false; } else { if(t.rem<=0) t.rem=DUR[n]; t.end=Date.now()+t.rem*1000; t.run=true; } pintar(); return; }
  if(b.dataset.tr){ delete TM[+b.dataset.tr]; pintar(); return; }
  if(b.dataset.fn){ EL.fridge=new Date().toISOString(); guardaEL(); pintar(); return; }
  if(b.dataset.rs){ EL.done={}; EL.open={}; EL.fridge=null; TM={}; guardaEL(); pintar(); return; } if(b.id==='pzM') PZ.n=Math.max(1,PZ.n-1); else if(b.id==='pzP') PZ.n=Math.min(20,PZ.n+1); else if(b.dataset.g) PZ.g=+b.dataset.g; else if(b.dataset.t) PZ.t=+b.dataset.t; else if(b.id==='pzSave'){ guardaPizza(b); return; } calcPizza(); return; }
  const c=e.target.closest('.card'); if(c){ abrir(c.dataset.id); return; } const b=e.target.closest('button'); if(!b) return;
  if(b.id==='addI'){ const i=$('nuevoI'), v=i.value.trim(); if(!v) return; U[b.dataset.k].push({t:v,ok:false}); guardaU(b.dataset.k); pintar(); $('nuevoI').focus(); }
  else if(b.dataset.quita){ const k=b.dataset.quita; U[k]=U[k].filter(x=>!x.ok); guardaU(k); pintar(); }
  else if(b.dataset.copia){ const t=U[b.dataset.copia].map(x=>'- '+x.t).join('\n'); try{ navigator.clipboard.writeText(t); b.textContent='✓ Copiada'; }catch(_){} }
  else if(b.dataset.despensa){ U.compra.filter(x=>x.ok).forEach(x=>U.desp.push({t:x.t,ok:false})); U.compra=U.compra.filter(x=>!x.ok); guardaU('compra'); guardaU('desp'); pintar(); }
  else if(b.id==='menuCompra'){ let n=0; for(let i=0;i<7;i++) for(const s of ['c','n']){ const r=R.find(x=>x.id===U.menu[i+s]); if(r){ lineas(r.ingredientes).forEach(l=>{ U.compra.push({t:l.replace(/^[-•*·]\s*/,''),ok:false}); n++; }); } } guardaU('compra'); b.textContent='✓ '+n+' ingredientes añadidos'; }
  else if(b.id==='menuBorra'){ U.menu={}; guardaU('menu'); pintar(); } };
$('main').addEventListener('change',e=>{ if(e.target.id==='frI'&&e.target.value){ EL.fridge=new Date(e.target.value).toISOString(); guardaEL(); pintar(); } });
$('main').addEventListener('change',e=>{ const t=e.target; if(!t.dataset) return;

  else if(t.dataset.tg){ const v=String(t.value).trim()===''?null:parseFloat(String(t.value).replace(',','.')); TS.g[t.dataset.tg]=(v!=null&&isFinite(v)&&v>=0)?v:null; guardaTS(); pintar(); }
  else if(t.dataset.ta){ const v=parseFloat(String(t.value).replace(',','.')); TS.antes=isFinite(v)&&v>=0?v:8; guardaTS(); pintar(); }
  else if(t.dataset.hr){ EL.hora=t.value; guardaEL(); pintar(); }

  else if(t.dataset.pz){ PZSEL=t.value; guardaPZP(); pintar(); } });
$('main').oninput=e=>{ if(e.target.id==='pzH'){ PZ.h=parseFloat(e.target.value); calcPizza(); } };
$('main').onchange=e=>{ const c=e.target; if(c.type==='checkbox'&&c.dataset.k){ U[c.dataset.k][+c.dataset.i].ok=c.checked; guardaU(c.dataset.k); pintar(); } else if(c.dataset.m){ U.menu[c.dataset.m]=c.value; guardaU('menu'); } };
$('main').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='nuevoI') $('addI').click(); });
pintar(); cargar();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&$('sheet').hidden) cargar(); });
})();

<script>
/* Actualización automática */
(function(){
  var BUILD='V2.06', ROOT='../';
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){ intentos(intentos()+1); try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){} location.reload(); }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#1b1f2a;color:#eef0f5;border:1px solid rgba(255,255,255,.2);border-radius:12px;font:14px system-ui';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{ var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){ if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v); } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) comprobar(); });
})();
</script>
