/* ---------- utilidades ---------- */

 {t:'Primer reposo',d:'15 minutos',l:['Dejar la masa tapada a temperatura ambiente.','Permitir que el gluten se relaje.']},

 {t:'Preparación antes de hornear',d:'2-3 horas aproximadamente',l:['Sacar las bolas del frigorífico.','Mantenerlas tapadas hasta que estén relajadas y fáciles de estirar.','Estirar manualmente desde el centro hacia los bordes.','No utilizar rodillo para conservar el aire del borde.']},
 {t:'Horneado',d:'unos 2 minutos por pizza',l:['Poner el Ariete 3901 a su temperatura máxima de 430 °C.','Encender ambas resistencias.','Precalentar inicialmente durante 15-20 minutos.','Comprobar, si se dispone de termómetro infrarrojo, que la piedra esté aproximadamente entre 380 y 430 °C.','Cocinar la pizza unos 2 minutos, ajustando según el dorado.','Dejar recuperar la temperatura de la piedra antes de preparar la siguiente.']}]; }
function ltInput(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes()); }
function finFerm(){ if(!EL.fridge) return ''; const d=new Date(new Date(EL.fridge).getTime()+PZ.t*3600e3); return d.toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}); }
function pintaElab(){ const P=pasosEL(); const cur=P.findIndex((_,i)=>!EL.done[i]); const c=pzCalc();
 let h='<div class="meta" style="margin:6px 0 10px">'+PZ.n+' bolas de '+PZ.g+' g · harina '+f0(c.harina)+' g · agua '+f0(c.agua)+' g · sal '+f1(c.sal)+' g · levadura '+f2(c.lev)+' g · fermentación '+PZ.t+' h. Se ajusta a lo que elijas en la calculadora.</div>';
 h+=P.map((p,i)=>{ const hecho=!!EL.done[i], act=i===cur, abierto=EL.open[i]!==undefined?EL.open[i]:act; const dur=DUR[i+1];

  (abierto?'<div class="cue">'+p.l.map(x=>'<div>• '+x+'</div>').join('')+
   (dur?'<div class="fila tmr"><b data-tm="'+(i+1)+'">'+mmss(tmRest(i+1,dur))+'</b><button class="sm" data-tg="'+(i+1)+'">'+(TM[i+1]&&TM[i+1].run?'Pausa':'Iniciar')+'</button><button class="sm" data-tr="'+(i+1)+'">↺</button></div>':'')+

 h+='<div class="meta" style="margin:10px 0">Los tiempos de amasado y reposo son orientaciones prácticas para elaboración manual doméstica, no requisitos oficiales de la AVPN.</div><button data-rs="1">Empezar de nuevo</button>';

function tmRest(n,dur){ const t=TM[n]; if(!t) return dur; return t.run?(t.end-Date.now())/1000:t.rem; }
function tmTick(){ document.querySelectorAll('[data-tm]').forEach(el=>{ const n=+el.dataset.tm,t=TM[n]; if(!t||!t.run) return; const r=(t.end-Date.now())/1000; if(r<=0){ t.run=false; t.rem=0; el.textContent='¡Tiempo!'; pitido(); if(V==='pizza') setTimeout(pintar,50); } else el.textContent=mmss(r); }); }
setInterval(tmTick,500);
function pitido(){ try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){} try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,.4,.8].forEach(d=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=880; g.gain.value=.2; o.connect(g); g.connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+.25); }); }catch(e){} }

  try{ localStorage.setItem('dgp-cocina-pz',JSON.stringify(PZ)); }catch(e){} }
async function guardaPizza(b){ const c=pzCalc(); const hs=String(PZ.h).replace('.',',');
  const r={tipo:'receta',titulo:'Pizza napolitana · '+PZ.n+' × '+PZ.g+' g · '+hs+' % · '+PZ.t+' h',etiquetas:['pizza','masa'],raciones:PZ.n,tiempo:'Fermentación '+PZ.t+' h en frío',
   ingredientes:[f0(c.harina)+' g harina de fuerza Gallo',f0(c.agua)+' g agua',f1(c.sal)+' g sal',f2(c.lev)+' g levadura seca de panadería'].join('\n'),pasos:'',
   notas:'Masa total '+f0(c.total)+' g: '+PZ.n+' bolas de '+PZ.g+' g. Hidratación '+hs+' %, sal 2,86 %, levadura '+String(PZ_LEV[PZ.t]).replace('.',',')+' % (orientativa, frío 3-4 °C).\nHorno Ariete 3901 Da Gennaro a 430 °C (máx.), piedra 380-430 °C, 27-29 cm, aprox. 2 min. Precalentar 15-20 min y comprobar la piedra con termómetro infrarrojo; dejar recuperar la piedra entre pizzas.',fav:false};
  const g=await guardaR(r); b.textContent='✓ Guardada en Recetas'; return g; }

  const sh=$('sheet'); sh.hidden=false; document.body.style.overflow='hidden';

    sh.innerHTML='<div class="barra"><button id="x">←</button><span style="flex:1"></span><button id="fv" class="sm">'+(r.fav?'★':'☆')+'</button><button id="co" class="sm'+(cocina?' pri':'')+'">Cocinar</button><button id="ed" class="sm">Editar</button></div><div class="'+(cocina?'cook':'')+'"><h2>'+esc(r.titulo)+'</h2><div class="meta">'+[r.tiempo].filter(Boolean).map(esc).join('')+'</div>'+(r.etiquetas||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+
    (r.raciones?'<div class="fila" style="margin-top:10px"><button class="sm" id="rm">−</button><b>'+rac+' raciones</b><button class="sm" id="rp">+</button></div>':'')+
    (r.ingredientes?'<h3>Ingredientes</h3>'+lineas(r.ingredientes).map(l=>'<div class="lin" data-h>'+esc(escala(l,f))+'</div>').join('')+'<div style="margin-top:10px"><button class="sm" id="aC">+ A la compra</button></div>':'')+
    (r.pasos?'<h3>Preparación</h3>'+lineas(r.pasos).map((l,i)=>'<div class="paso" data-h><i>'+(i+1)+'</i><span>'+esc(l.replace(/^\d+[.)\-]\s*/,''))+'</span></div>').join(''):'')+

  pinta();

    if(t.id==='x'){ cerrar(); return; }

    else if(t.id==='co'){ cocina=!cocina; pantalla(cocina); pinta(); }
    else if(t.id==='fv'){ r.fav=!r.fav; await guardaR(r); pinta(); }
    else if(t.id==='ed'){ editar(r); }
    else if(t.id==='aC'){ const f=r.raciones?rac/r.raciones:1; lineas(r.ingredientes).forEach(l=>U.compra.push({t:escala(l,f).replace(/^[-•*·]\s*/,''),ok:false})); guardaU('compra'); t.textContent='✓ Añadido'; } }; }
function cerrar(){ $('sheet').hidden=true; $('sheet').innerHTML=''; document.body.style.overflow=''; pantalla(false); pintar(); }
/* ---------- importar / editar ---------- */
function nuevo(){ const sh=$('sheet'); sh.hidden=false; document.body.style.overflow='hidden';
  sh.innerHTML='<div class="barra"><button id="x">←</button><b style="flex:1">Añadir</b></div><div class="campo"><label>Pega aquí la nota completa (la primera línea es el título). Varias recetas: sepáralas con una línea ---</label><textarea id="pega" style="min-height:260px" placeholder="Pega la receta…"></textarea></div><div class="fila"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="esNota" style="width:22px;min-height:0"> Es una nota (truco, tiempos…)</label></div><div class="fila" style="margin-top:12px"><button class="pri" id="imp" style="flex:1">Guardar</button><button id="mano">Escribir a mano</button></div><div class="meta" id="res" style="margin-top:10px"></div>';
  sh.onclick=async e=>{ const t=e.target.closest('button'); if(!t) return; if(t.id==='x') cerrar();
    else if(t.id==='mano') editar({tipo:'receta',titulo:'',etiquetas:[],raciones:null,tiempo:'',ingredientes:'',pasos:'',notas:'',fav:false});

  '<div class="campo"><label>Tipo</label><select id="f_tipo"><option value="receta"'+(r.tipo==='receta'?' selected':'')+'>Receta</option><option value="nota"'+(r.tipo==='nota'?' selected':'')+'>Nota de cocina</option></select></div>'+

  '<div class="campo"><label>Preparación (un paso por línea)</label><textarea id="f_p" style="min-height:200px">'+esc(r.pasos)+'</textarea></div>'+

/* ---------- eventos ---------- */
$('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; V=b.dataset.v; TAG=''; Q=''; $('q').value=''; pintar(); };

$('main').onclick=e=>{ if(V==='pizza'){ const st=e.target.closest('[data-st]'); if(st){ const i=+st.dataset.st, P=pasosEL(), cur=P.findIndex((_,k)=>!EL.done[k]); const ab=EL.open[i]!==undefined?EL.open[i]:i===cur; EL.open[i]=!ab; guardaEL(); pintar(); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.sub){ PZV=b.dataset.sub; pintar(); return; }
  if(b.dataset.dn!==undefined){ const i=+b.dataset.dn; EL.done[i]=!EL.done[i]; EL.open[i]=false; const P=pasosEL(), nx=P.findIndex((_,k)=>!EL.done[k]); if(nx>=0) EL.open[nx]=true; guardaEL(); pintar(); return; }
  if(b.dataset.tg){ const n=+b.dataset.tg, t=TM[n]||(TM[n]={run:false,rem:DUR[n],end:0}); if(t.run){ t.rem=(t.end-Date.now())/1000; t.run=false; } else { if(t.rem<=0) t.rem=DUR[n]; t.end=Date.now()+t.rem*1000; t.run=true; } pintar(); return; }

<script>
/* Actualización automática */
(function(){
  var BUILD='V2.01', ROOT='../';
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){ intentos(intentos()+1); try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){} location.reload(); }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#1b1f2a;color:#eef0f5;border:1px solid rgba(255,255,255,.2);border-radius:12px;font:14px system-ui';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{ var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){ if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v); } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) comprobar(); });
})();
</script>
