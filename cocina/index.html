<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cocina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c11">
<title>Cocina</title>
<style>
:root{--bg:#0a0c11;--s1:#11141b;--s2:#181c26;--bd:rgba(255,255,255,.14);--tx:#eef0f5;--mut:#98a1b5;--ac:#ffb81c;--pos:#35d39a;--neg:#ff7070}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--s1:#fff;--s2:#eef0f6;--bd:rgba(15,20,35,.16);--tx:#10131a;--mut:#58627a;--ac:#946100;--pos:#0e7c57;--neg:#c42b2b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--s2);border:1px solid var(--bd);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}
button.sm{min-height:34px;padding:0 10px;font-size:.85rem}
input,select,textarea{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:120px;resize:vertical;line-height:1.4}
.top{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.tabs button{flex:1;min-width:0;padding:0 2px;font-size:.8rem}
.tabs button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.bus{display:flex;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:0 0 auto;min-height:32px;padding:0 12px;border-radius:999px;font-size:.85rem}
.chip.on{background:var(--ac);color:#000;border-color:var(--ac)}
main{padding:10px 12px;max-width:900px;margin:0 auto}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer}
.card b{display:block;font-size:1.02rem}
.meta{color:var(--mut);font-size:.82rem;margin-top:2px}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:0 8px;font-size:.75rem;margin:4px 4px 0 0;color:var(--mut)}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:1.8rem;padding:0;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.sheet .barra{display:flex;gap:8px;align-items:center;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:2}
.sheet h2{margin:6px 0;font-size:1.4rem}
.sheet h3{margin:16px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.lin{padding:8px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.lin.hecho{opacity:.4;text-decoration:line-through}
.paso{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.paso i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);font-style:normal;text-align:center;font-size:.8rem;line-height:24px}
.paso.hecho{opacity:.4}.paso.hecho span{text-decoration:line-through}
.cook{font-size:1.35rem;line-height:1.5}
.cook .lin,.cook .paso{padding:14px 4px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.campo{margin:10px 0}.campo label{display:block;color:var(--mut);font-size:.8rem;margin-bottom:4px}
.vacio{color:var(--mut);text-align:center;padding:40px 12px}
.aviso{background:var(--s1);border:1px solid var(--ac);border-radius:12px;padding:14px;margin:12px 0}
.item{display:flex;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--bd)}
.item input[type=checkbox]{width:24px;height:24px;min-height:0;flex:0 0 auto}
.item span{flex:1}.item.ok span{opacity:.4;text-decoration:line-through}
.dia{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.dia b{font-size:.9rem}.dia select{min-height:40px;padding:6px 8px;font-size:.85rem}
</style>
</head>
<body>
<div class="top">
  <div class="tabs" id="tabs">
    <button data-v="rec" class="on">Recetas</button><button data-v="menu">Menú</button><button data-v="compra">Compra</button><button data-v="desp">Despensa</button><button data-v="nota">Notas</button>
  </div>
  <div class="bus" id="bus"><input id="q" type="search" placeholder="Buscar nombre, ingrediente, etiqueta…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<button class="fab pri" id="fab" aria-label="Añadir">+</button>
<div class="sheet" id="sheet" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const URL0='https://qtnqupcfgooazjzkpmtx.supabase.co', KEY='sb_publishable_brvDWgh8e_IrS8NWDvt7xg_rbL2dqcd';
const sbc=window.supabase?window.supabase.createClient(URL0,KEY):null;
async function cab(){ try{ if(!sbc) return null; const {data:{session}}=await sbc.auth.getSession(); return session?{apikey:KEY,Authorization:'Bearer '+session.access_token}:null; }catch(e){ return null; } }
let R=[], U={compra:[],desp:[],menu:{}}, V='rec', Q='', TAG='', conSesion=true, cargado=false;
try{ R=JSON.parse(localStorage.getItem('dgp-cocina')||'[]'); U=Object.assign(U,JSON.parse(localStorage.getItem('dgp-cocina-u')||'{}')); V=localStorage.getItem('dgp-cocina-v')||'rec'; }catch(e){}
function cache(){ try{ localStorage.setItem('dgp-cocina',JSON.stringify(R)); localStorage.setItem('dgp-cocina-u',JSON.stringify(U)); }catch(e){} }
/* ---------- servidor ---------- */
async function api(path,opt){ const H=await cab(); if(!H){ conSesion=false; return null; } opt=opt||{};
  const h=Object.assign({'Accept-Profile':'personal','Content-Profile':'personal','Content-Type':'application/json'},H,opt.h||{});
  try{ const r=await fetch(URL0+'/rest/v1/'+path,{method:opt.m||'GET',headers:h,body:opt.b?JSON.stringify(opt.b):undefined}); if(!r.ok) return null; const t=await r.text(); return t?JSON.parse(t):[]; }catch(e){ return null; } }
async function cargar(){
  const a=await api('recetas?select=*&order=titulo.asc'); if(a){ R=a; conSesion=true; }
  const u=await api('ui_estado?clave=in.(cocina_compra,cocina_despensa,cocina_menu)&select=clave,valor');
  if(u){ u.forEach(x=>{ if(x.clave==='cocina_compra') U.compra=x.valor||[]; if(x.clave==='cocina_despensa') U.desp=x.valor||[]; if(x.clave==='cocina_menu') U.menu=x.valor||{}; }); }
  cargado=true; cache(); pintar(); }
const tU={}; function guardaU(k){ cache(); clearTimeout(tU[k]); tU[k]=setTimeout(()=>{ const clave={compra:'cocina_compra',desp:'cocina_despensa',menu:'cocina_menu'}[k];
  api('ui_estado?on_conflict=clave',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{clave,valor:U[k],actualizado:new Date().toISOString()}}); },500); }
async function guardaR(r){ r.actualizado=new Date().toISOString(); const cuerpo={tipo:r.tipo,titulo:r.titulo,etiquetas:r.etiquetas,raciones:r.raciones,tiempo:r.tiempo,ingredientes:r.ingredientes,pasos:r.pasos,notas:r.notas,fav:!!r.fav,actualizado:r.actualizado};
  if(r.id){ const i=R.findIndex(x=>x.id===r.id); if(i>=0) R[i]=r; cache(); await api('recetas?id=eq.'+r.id,{m:'PATCH',b:cuerpo,h:{Prefer:'return=minimal'}}); return r; }
  const a=await api('recetas',{m:'POST',b:cuerpo,h:{Prefer:'return=representation'}}); if(a&&a[0]){ R.push(a[0]); cache(); return a[0]; }
  r.id='local-'+Date.now(); R.push(r); cache(); return r; }
async function borraR(id){ R=R.filter(x=>x.id!==id); cache(); await api('recetas?id=eq.'+id,{m:'DELETE',h:{Prefer:'return=minimal'}}); }
/* ---------- utilidades ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const lineas=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3};
function fmt(n){ const r=Math.round(n*100)/100; return String(r).replace('.',','); }
function escala(l,f){ if(f===1) return l; return l.replace(/^(\s*[-•*·]?\s*)(\d+\s*\/\s*\d+|\d+[.,]\d+|\d+|[½¼¾⅓])/,(m,p,n)=>{ let v; if(FR[n]!=null) v=FR[n]; else if(n.includes('/')){ const [a,b]=n.split('/'); v=a/b; } else v=parseFloat(n.replace(',','.')); return p+fmt(v*f); }); }
const AUTO=[['postre','postre|tarta|flan|natillas|bizcocho|helado|brownie|galleta|tiramis'],['carne','pollo|ternera|cerdo|cordero|carne|hamburguesa|solomillo|costilla'],['pescado','pescado|merluza|salm[oó]n|bacalao|at[uú]n|gamba|marisco|pulpo'],['pasta','pasta|espagueti|macarron|lasa[ñn]a|tallarines'],['arroz','arroz|paella|risotto'],['verdura','verdura|ensalada|calabac[ií]n|berenjena|espinaca|br[oó]coli'],['sopa','sopa|crema de|caldo|gazpacho'],['legumbres','lentejas|garbanzos|alubias|judías'],['pan','pan |masa|focaccia|pizza']];
function autoTags(t){ const n=norm(t); return AUTO.filter(a=>new RegExp(a[1].normalize('NFD').replace(/[̀-ͯ]/g,'')).test(n)).map(a=>a[0]); }
const H_ING=/^(ingredientes?|ingredients?)\s*:?$/i, H_PAS=/^(preparaci[oó]n|pasos|elaboraci[oó]n|instrucciones|procedimiento|modo de hacer|m[eé]todo)\s*:?$/i;
function parseNota(txt){ const L=String(txt).split('\n').map(x=>x.replace(/\s+$/,'')); while(L.length&&!L[0].trim()) L.shift(); if(!L.length) return null;
  const titulo=L.shift().replace(/^[#*\s]+|[#*\s]+$/g,'').slice(0,160)||'Sin título'; let ing=[],pas=[],otros=[],modo='';
  const hay=L.some(x=>H_ING.test(x.trim())||H_PAS.test(x.trim()));
  L.forEach(x=>{ const t=x.trim(); if(!t) return;
    if(H_ING.test(t)){ modo='i'; return; } if(H_PAS.test(t)){ modo='p'; return; }
    if(hay){ if(modo==='i') ing.push(t); else if(modo==='p') pas.push(t); else otros.push(t); }
    else { if(t.length<70&&(/^[-•*·]/.test(t)||/^\d/.test(t)||/\b(g|kg|ml|l|cucharada|cucharadita|taza|vaso|pizca|diente|unidad|ud)\b/i.test(t))) ing.push(t); else pas.push(t); } });
  const rac=(txt.match(/(\d+)\s*(raciones|personas|comensales)/i)||[])[1];
  return {tipo:'receta',titulo,etiquetas:autoTags(txt),raciones:rac?+rac:null,tiempo:'',ingredientes:ing.join('\n'),pasos:pas.join('\n'),notas:otros.join('\n'),fav:false}; }
/* ---------- pintar ---------- */
function filtradas(tipo){ const q=norm(Q).split(/\s+/).filter(Boolean);
  return R.filter(r=>(r.tipo||'receta')===tipo).filter(r=>!TAG||(TAG==='★'?r.fav:(r.etiquetas||[]).includes(TAG))).filter(r=>{ if(!q.length) return true; const h=norm([r.titulo,(r.etiquetas||[]).join(' '),r.ingredientes,r.notas].join(' ')); return q.every(w=>h.includes(w)); }).sort((a,b)=>a.titulo.localeCompare(b.titulo,'es')); }
function pintar(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
  const lista=V==='rec'||V==='nota'; $('bus').hidden=!lista; $('chips').hidden=!lista; $('fab').hidden=!(lista); try{ localStorage.setItem('dgp-cocina-v',V); }catch(e){}
  let h='';
  if(!conSesion&&!R.length) h+='<div class="aviso">Para ver y guardar tus recetas entra primero en el hub (DGP) con tu sesión y vuelve aquí.<br><br><a href="../" style="color:var(--ac)">Abrir DGP</a></div>';
  if(lista){ const tipo=V==='rec'?'receta':'nota'; const todas=R.filter(r=>(r.tipo||'receta')===tipo); const tags=[...new Set(todas.flatMap(r=>r.etiquetas||[]))].sort((a,b)=>a.localeCompare(b,'es'));
    $('chips').innerHTML=(todas.some(r=>r.fav)?'<button class="chip'+(TAG==='★'?' on':'')+'" data-t="★">★</button>':'')+tags.map(t=>'<button class="chip'+(TAG===t?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('');
    const f=filtradas(tipo);
    h+=f.length?'<div class="grid">'+f.map(r=>'<div class="card" data-id="'+esc(r.id)+'"><b>'+(r.fav?'★ ':'')+esc(r.titulo)+'</b><div class="meta">'+[r.tiempo,r.raciones?r.raciones+' raciones':''].filter(Boolean).map(esc).join(' · ')+'</div>'+(r.etiquetas||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>').join('')+'</div>':'<div class="vacio">'+(todas.length?'Nada que coincida.':(cargado?'Aún no hay nada. Toca + para pegar una nota.':'Cargando…'))+'</div>'; }
  else if(V==='compra'||V==='desp') h+=pintaLista(V);
  else if(V==='menu') h+=pintaMenu();
  $('main').innerHTML=h; }
function pintaLista(k){ const L=U[k]; return '<div class="fila" style="margin-bottom:8px"><input id="nuevoI" placeholder="'+(k==='compra'?'Añadir a la compra':'Añadir a la despensa')+'" autocomplete="off" style="flex:1"><button class="pri" id="addI" data-k="'+k+'">+</button></div>'+
  (L.length?L.map((x,i)=>'<div class="item'+(x.ok?' ok':'')+'"><input type="checkbox" data-k="'+k+'" data-i="'+i+'"'+(x.ok?' checked':'')+'><span>'+esc(x.t)+'</span></div>').join(''):'<div class="vacio">Vacía.</div>')+
  '<div class="fila" style="margin-top:12px"><button data-quita="'+k+'">Quitar marcados</button><button data-copia="'+k+'">Copiar lista</button>'+(k==='compra'?'<button data-despensa="1">Marcados → despensa</button>':'')+'</div>'; }
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
function pintaMenu(){ const recs=R.filter(r=>(r.tipo||'receta')==='receta').sort((a,b)=>a.titulo.localeCompare(b.titulo,'es')); const op=v=>'<option value="">—</option>'+recs.map(r=>'<option value="'+esc(r.id)+'"'+(v===r.id?' selected':'')+'>'+esc(r.titulo)+'</option>').join('');
  return DIAS.map((d,i)=>'<div class="dia"><b>'+d.slice(0,3)+'</b><select data-m="'+i+'c">'+op((U.menu[i+'c']))+'</select><select data-m="'+i+'n">'+op((U.menu[i+'n']))+'</select></div>').join('')+'<div class="meta" style="margin:6px 0">Primera columna comida, segunda cena.</div><div class="fila"><button class="pri" id="menuCompra">Ingredientes de la semana → compra</button><button id="menuBorra">Vaciar menú</button></div>'; }
/* ---------- detalle ---------- */
let wl=null; async function pantalla(on){ try{ if(on&&'wakeLock' in navigator) wl=await navigator.wakeLock.request('screen'); else if(wl){ await wl.release(); wl=null; } }catch(e){} }
function abrir(id){ const r=R.find(x=>x.id===id); if(!r) return; let rac=r.raciones||0, cocina=false;
  const sh=$('sheet'); sh.hidden=false; document.body.style.overflow='hidden';
  function pinta(){ const f=r.raciones?rac/r.raciones:1;
    sh.innerHTML='<div class="barra"><button id="x">←</button><span style="flex:1"></span><button id="fv" class="sm">'+(r.fav?'★':'☆')+'</button><button id="co" class="sm'+(cocina?' pri':'')+'">Cocinar</button><button id="ed" class="sm">Editar</button></div><div class="'+(cocina?'cook':'')+'"><h2>'+esc(r.titulo)+'</h2><div class="meta">'+[r.tiempo].filter(Boolean).map(esc).join('')+'</div>'+(r.etiquetas||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+
    (r.raciones?'<div class="fila" style="margin-top:10px"><button class="sm" id="rm">−</button><b>'+rac+' raciones</b><button class="sm" id="rp">+</button></div>':'')+
    (r.ingredientes?'<h3>Ingredientes</h3>'+lineas(r.ingredientes).map(l=>'<div class="lin" data-h>'+esc(escala(l,f))+'</div>').join('')+'<div style="margin-top:10px"><button class="sm" id="aC">+ A la compra</button></div>':'')+
    (r.pasos?'<h3>Preparación</h3>'+lineas(r.pasos).map((l,i)=>'<div class="paso" data-h><i>'+(i+1)+'</i><span>'+esc(l.replace(/^\d+[.)\-]\s*/,''))+'</span></div>').join(''):'')+
    (r.notas?'<h3>Notas</h3><div style="white-space:pre-wrap">'+esc(r.notas)+'</div>':'')+'</div>'; }
  pinta();
  sh.onclick=async e=>{ const t=e.target.closest('button,[data-h]'); if(!t) return;
    if(t.id==='x'){ cerrar(); return; }
    if(t.dataset.h!==undefined){ t.classList.toggle('hecho'); return; }
    if(t.id==='rm'){ rac=Math.max(1,rac-1); pinta(); } else if(t.id==='rp'){ rac++; pinta(); }
    else if(t.id==='co'){ cocina=!cocina; pantalla(cocina); pinta(); }
    else if(t.id==='fv'){ r.fav=!r.fav; await guardaR(r); pinta(); }
    else if(t.id==='ed'){ editar(r); }
    else if(t.id==='aC'){ const f=r.raciones?rac/r.raciones:1; lineas(r.ingredientes).forEach(l=>U.compra.push({t:escala(l,f).replace(/^[-•*·]\s*/,''),ok:false})); guardaU('compra'); t.textContent='✓ Añadido'; } }; }
function cerrar(){ $('sheet').hidden=true; $('sheet').innerHTML=''; document.body.style.overflow=''; pantalla(false); pintar(); }
/* ---------- importar / editar ---------- */
function nuevo(){ const sh=$('sheet'); sh.hidden=false; document.body.style.overflow='hidden';
  sh.innerHTML='<div class="barra"><button id="x">←</button><b style="flex:1">Añadir</b></div><div class="campo"><label>Pega aquí la nota completa (la primera línea es el título). Varias recetas: sepáralas con una línea ---</label><textarea id="pega" style="min-height:260px" placeholder="Pega la receta…"></textarea></div><div class="fila"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="esNota" style="width:22px;min-height:0"> Es una nota (truco, tiempos…)</label></div><div class="fila" style="margin-top:12px"><button class="pri" id="imp" style="flex:1">Guardar</button><button id="mano">Escribir a mano</button></div><div class="meta" id="res" style="margin-top:10px"></div>';
  sh.onclick=async e=>{ const t=e.target.closest('button'); if(!t) return; if(t.id==='x') cerrar();
    else if(t.id==='mano') editar({tipo:'receta',titulo:'',etiquetas:[],raciones:null,tiempo:'',ingredientes:'',pasos:'',notas:'',fav:false});
    else if(t.id==='imp'){ const v=$('pega').value; if(!v.trim()) return; t.disabled=true; const trozos=v.split(/\n\s*(?:-{3,}|={3,}|_{3,})\s*\n/); let ult=null,n=0; for(const c of trozos){ const r=parseNota(c); if(!r) continue; if($('esNota').checked){ r.tipo='nota'; r.notas=[r.ingredientes,r.pasos,r.notas].filter(Boolean).join('\n'); r.ingredientes=''; r.pasos=''; } ult=await guardaR(r); n++; }
      if(n===1&&ult){ $('sheet').hidden=true; abrir(ult.id); } else { $('res').textContent=n+' guardadas.'; setTimeout(cerrar,600); } } }; }
function editar(r){ const sh=$('sheet'); sh.hidden=false; document.body.style.overflow='hidden'; const eti=[...new Set(R.flatMap(x=>x.etiquetas||[]))];
  sh.innerHTML='<div class="barra"><button id="x">←</button><b style="flex:1">'+(r.id?'Editar':'Nueva')+'</b>'+(r.id?'<button id="del" class="sm" style="color:var(--neg)">Borrar</button>':'')+'<button class="pri" id="ok">Guardar</button></div>'+
  '<div class="campo"><label>Tipo</label><select id="f_tipo"><option value="receta"'+(r.tipo==='receta'?' selected':'')+'>Receta</option><option value="nota"'+(r.tipo==='nota'?' selected':'')+'>Nota de cocina</option></select></div>'+
  '<div class="campo"><label>Título</label><input id="f_t" value="'+esc(r.titulo)+'"></div>'+
  '<div class="campo"><label>Etiquetas (separadas por comas)</label><input id="f_e" value="'+esc((r.etiquetas||[]).join(', '))+'"><div>'+eti.map(t=>'<button class="chip" data-add="'+esc(t)+'">'+esc(t)+'</button>').join(' ')+'</div></div>'+
  '<div class="fila"><div class="campo" style="flex:1"><label>Raciones</label><input id="f_r" type="number" inputmode="numeric" value="'+(r.raciones||'')+'"></div><div class="campo" style="flex:1"><label>Tiempo</label><input id="f_ti" value="'+esc(r.tiempo)+'"></div></div>'+
  '<div class="campo"><label>Ingredientes (uno por línea)</label><textarea id="f_i" style="min-height:160px">'+esc(r.ingredientes)+'</textarea></div>'+
  '<div class="campo"><label>Preparación (un paso por línea)</label><textarea id="f_p" style="min-height:200px">'+esc(r.pasos)+'</textarea></div>'+
  '<div class="campo"><label>Notas</label><textarea id="f_n">'+esc(r.notas)+'</textarea></div>';
  sh.onclick=async e=>{ const t=e.target.closest('button'); if(!t) return;
    if(t.id==='x'){ r.id?abrir(r.id):cerrar(); }
    else if(t.dataset.add){ const i=$('f_e'); const a=i.value.split(',').map(x=>x.trim()).filter(Boolean); if(!a.includes(t.dataset.add)) a.push(t.dataset.add); i.value=a.join(', '); }
    else if(t.id==='del'){ if(t.dataset.c!=='1'){ t.dataset.c='1'; t.textContent='¿Seguro?'; return; } await borraR(r.id); cerrar(); }
    else if(t.id==='ok'){ const o=Object.assign({},r,{tipo:$('f_tipo').value,titulo:$('f_t').value.trim()||'Sin título',etiquetas:$('f_e').value.split(',').map(x=>x.trim()).filter(Boolean),raciones:parseInt($('f_r').value)||null,tiempo:$('f_ti').value.trim(),ingredientes:$('f_i').value,pasos:$('f_p').value,notas:$('f_n').value}); const g=await guardaR(o); $('sheet').hidden=true; abrir(g.id); } }; }
/* ---------- eventos ---------- */
$('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; V=b.dataset.v; TAG=''; Q=''; $('q').value=''; pintar(); };
$('q').oninput=()=>{ Q=$('q').value; pintar(); };
$('chips').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; TAG=TAG===b.dataset.t?'':b.dataset.t; pintar(); };
$('fab').onclick=nuevo;
$('main').onclick=e=>{ const c=e.target.closest('.card'); if(c){ abrir(c.dataset.id); return; } const b=e.target.closest('button'); if(!b) return;
  if(b.id==='addI'){ const i=$('nuevoI'), v=i.value.trim(); if(!v) return; U[b.dataset.k].push({t:v,ok:false}); guardaU(b.dataset.k); pintar(); $('nuevoI').focus(); }
  else if(b.dataset.quita){ const k=b.dataset.quita; U[k]=U[k].filter(x=>!x.ok); guardaU(k); pintar(); }
  else if(b.dataset.copia){ const t=U[b.dataset.copia].map(x=>'- '+x.t).join('\n'); try{ navigator.clipboard.writeText(t); b.textContent='✓ Copiada'; }catch(_){} }
  else if(b.dataset.despensa){ U.compra.filter(x=>x.ok).forEach(x=>U.desp.push({t:x.t,ok:false})); U.compra=U.compra.filter(x=>!x.ok); guardaU('compra'); guardaU('desp'); pintar(); }
  else if(b.id==='menuCompra'){ let n=0; for(let i=0;i<7;i++) for(const s of ['c','n']){ const r=R.find(x=>x.id===U.menu[i+s]); if(r){ lineas(r.ingredientes).forEach(l=>{ U.compra.push({t:l.replace(/^[-•*·]\s*/,''),ok:false}); n++; }); } } guardaU('compra'); b.textContent='✓ '+n+' ingredientes añadidos'; }
  else if(b.id==='menuBorra'){ U.menu={}; guardaU('menu'); pintar(); } };
$('main').onchange=e=>{ const c=e.target; if(c.type==='checkbox'&&c.dataset.k){ U[c.dataset.k][+c.dataset.i].ok=c.checked; guardaU(c.dataset.k); pintar(); } else if(c.dataset.m){ U.menu[c.dataset.m]=c.value; guardaU('menu'); } };
$('main').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='nuevoI') $('addI').click(); });
pintar(); cargar();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&$('sheet').hidden) cargar(); });
})();
</script>
<script>
/* Actualización automática */
(function(){
  var BUILD='V2.24', ROOT='../';
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){ intentos(intentos()+1); try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){} location.reload(); }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#1b1f2a;color:#eef0f5;border:1px solid rgba(255,255,255,.2);border-radius:12px;font:14px system-ui';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{ var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){ if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v); } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) comprobar(); });
})();
</script>
