<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGP</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mut:#8b93a7;--ac:#f5c518;--bd:#262a35}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--tx:#14161c;--mut:#5d6578;--ac:#b8860b;--bd:#e3e6ec}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
#stats{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit}
#q{flex:1 1 200px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.nota{min-width:42px;height:42px;border-radius:50%;background:var(--ac);color:#111;font-weight:700;display:grid;place-items:center}
.t{font-weight:600;color:var(--tx);text-decoration:none}
.m{color:var(--mut);font-size:.85rem}
#login{max-width:340px;margin:20vh auto;display:flex;flex-direction:column;gap:10px}
button{background:var(--ac);color:#111;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
#out{background:none;color:var(--mut);padding:4px 8px;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center}
#add{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
#add .row{display:flex;gap:8px}
#add input{flex:1}
.res{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.res:hover{background:var(--bg)}
.res img{width:34px;height:50px;object-fit:cover;border-radius:4px;background:var(--bd)}
.notas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.notas button{min-width:40px}
#msg{color:var(--mut);padding:24px 0;text-align:center}
#nav{display:flex;gap:6px;overflow-x:auto;margin:8px 0 14px;padding-bottom:4px}
#nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap;font-weight:500}
#nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.del{background:none;color:var(--mut);padding:2px 8px;font-weight:400}
#tf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
</style>
</head>
<body>
<main>
<form id="login" hidden>
  <h1>Acceso</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <button>Entrar</button>
  <div id="lm" class="m"></div>
</form>
<div id="app" hidden>
  <div class="top"><h1>DGP</h1><button id="out">Salir</button></div>
  <nav id="nav"></nav>
  <div id="v-tabla" hidden>
    <div class="bar"><input id="tq2" type="search" placeholder="Buscar…"><button id="tadd">+ Añadir</button></div>
    <form id="tf" hidden></form>
    <div id="tstat" class="m" style="margin-bottom:8px"></div>
    <div class="tw"><table id="tt"></table></div>
  </div>
  <div id="v-imdb" hidden>
  <div class="bar"><button id="addb">+ Añadir</button></div>
  <div id="stats"></div>
  <div id="add" hidden>
    <div class="row"><input id="tq" type="search" placeholder="Buscar película o serie…"><button id="tgo">Buscar</button></div>
    <div id="tres"></div>
    <div id="tsel" hidden>
      <div id="tinfo" class="t"></div>
      <div class="notas" id="tnotas"></div>
    </div>
    <div id="tmsg" class="m"></div>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar título, director, género…">
    <select id="o">
      <option value="date_rated.desc">Más recientes</option>
      <option value="your_rating.desc">Mi nota ↓</option>
      <option value="imdb_rating.desc">Nota IMDb ↓</option>
      <option value="year.desc">Año ↓</option>
      <option value="title.asc">Título A-Z</option>
    </select>
    <select id="n"><option value="">Todas las notas</option></select>
  </div>
  <div id="msg">Cargando…</div>
  <div id="list"></div>
  </div>
  <div class="m" style="text-align:center;margin-top:16px">v1.3 · 2026-10-26</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://qtnqupcfgooazjzkpmtx.supabase.co';
const ANON_KEY='sb_publishable_brvDWgh8e_IrS8NWDvt7xg_rbL2dqcd';
const $=id=>document.getElementById(id);
let data=[];

const sb=supabase.createClient(SUPABASE_URL,ANON_KEY,{db:{schema:'personal'}});

async function cargar(){
  let all=[],from=0,step=1000;
  while(true){
    const {data:rows,error}=await sb.from('imdb_ratings').select('*')
      .order('date_rated',{ascending:false}).range(from,from+step-1);
    if(error)throw error;
    all=all.concat(rows);
    if(rows.length<step)break;
    from+=step;
  }
  return all;
}

function pintar(){
  const q=$('q').value.toLowerCase().trim();
  const nota=$('n').value;
  const [campo,dir]=$('o').value.split('.');
  let f=data.filter(x=>(!nota||String(x.your_rating)===nota)&&
    (!q||[x.title,x.directors,x.genres].some(v=>(v||'').toLowerCase().includes(q))));
  f.sort((a,b)=>{
    const A=a[campo]??'',B=b[campo]??'';
    const c=typeof A==='number'&&typeof B==='number'?A-B:String(A).localeCompare(String(B));
    return dir==='desc'?-c:c;
  });
  $('msg').textContent=f.length?'':'Sin resultados';
  $('list').innerHTML=f.map(x=>`
    <div class="item">
      <div class="nota">${x.your_rating??'–'}</div>
      <div>
        <a class="t" href="${x.url||'#'}" target="_blank" rel="noopener">${esc(x.title)}</a>
        <div class="m">${x.year??''} · ${esc(x.title_type||'')} · IMDb ${x.imdb_rating??'–'}${x.directors?' · '+esc(x.directors):''}</div>
        <div class="m">${esc(x.genres||'')}${x.date_rated?' · valorada '+x.date_rated:''}</div>
      </div>
    </div>`).join('');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- Secciones ----
let secs=[],sec=null,filas=[],ord=null,dir=1;
async function cargarSecciones(){
  const {data:r,error}=await sb.from('secciones').select('*').order('orden');
  if(error){$('nav').textContent='No se pudieron cargar las secciones: '+error.message;return}
  secs=r;
  $('nav').innerHTML=secs.map(s=>`<button data-s="${s.slug}">${esc(s.icono)} ${esc(s.nombre)}</button>`).join('');
  const last=localStorage.getItem('dgp_sec');
  abrir((secs.find(s=>s.slug===last)||secs[0]||{}).slug);
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)abrir(b.dataset.s)});
async function abrir(slug){
  sec=secs.find(s=>s.slug===slug);if(!sec)return;
  try{localStorage.setItem('dgp_sec',slug)}catch(_){}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===slug));
  const imdb=sec.tipo==='imdb';
  $('v-imdb').hidden=!imdb;$('v-tabla').hidden=imdb;
  if(imdb)return;
  const c=sec.config||{};ord=c.orden||null;dir=c.dir==='asc'?1:-1;
  $('tq2').value='';$('tf').hidden=true;
  $('tstat').textContent='Cargando…';
  const {data:r,error}=await sb.from('registros').select('*').eq('seccion_id',sec.id).order('creado');
  if(error){$('tstat').textContent='Error: '+error.message;return}
  filas=r;pintarTabla();
}
function pintarTabla(){
  const cols=(sec.config||{}).columnas||[];
  const q=$('tq2').value.toLowerCase().trim();
  let f=filas.filter(r=>!q||cols.some(c=>String(r.datos[c.k]??'').toLowerCase().includes(q)));
  if(ord)f.sort((a,b)=>{
    const A=a.datos[ord]??'',B=b.datos[ord]??'';
    return (typeof A==='number'&&typeof B==='number'?A-B:String(A).localeCompare(String(B)))*dir;
  });
  $('tstat').textContent=f.length+' de '+filas.length+' registros';
  $('tt').innerHTML='<thead><tr>'+cols.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k}">${esc(c.t)}${ord===c.k?(dir>0?' ▲':' ▼'):''}</th>`).join('')+'<th></th></tr></thead><tbody>'+
    f.map(r=>'<tr>'+cols.map(c=>{const v=r.datos[c.k];return `<td class="${c.n?'n':''}">${c.n&&typeof v==='number'?v.toLocaleString('es-ES'):esc(v)}</td>`}).join('')+`<td><button class="del" data-id="${r.id}" title="Borrar">✕</button></td></tr>`).join('')+'</tbody>';
}
$('tt').addEventListener('click',async e=>{
  const th=e.target.closest('th[data-k]');
  if(th){dir=ord===th.dataset.k?-dir:1;ord=th.dataset.k;pintarTabla();return}
  const d=e.target.closest('.del');
  if(d&&confirm('¿Borrar este registro?')){
    const {error}=await sb.from('registros').delete().eq('id',d.dataset.id);
    if(error){alert(error.message);return}
    filas=filas.filter(r=>r.id!==d.dataset.id);pintarTabla();
  }
});
$('tq2').addEventListener('input',pintarTabla);
$('tadd').addEventListener('click',()=>{
  const cols=(sec.config||{}).columnas||[];
  $('tf').innerHTML=cols.map(c=>`<input name="${c.k}" placeholder="${esc(c.t)}" ${c.n?'inputmode="decimal"':''}>`).join('')+'<button>Guardar</button>';
  $('tf').hidden=!$('tf').hidden;
});
$('tf').addEventListener('submit',async e=>{
  e.preventDefault();
  const cols=(sec.config||{}).columnas||[],datos={};
  cols.forEach(c=>{
    const v=e.target.elements[c.k].value.trim();if(v==='')return;
    datos[c.k]=c.n?Number(v.replace(',','.')):v;
  });
  if(!Object.keys(datos).length)return;
  const {data:r,error}=await sb.from('registros').insert({seccion_id:sec.id,datos}).select().single();
  if(error){alert(error.message);return}
  filas.push(r);$('tf').hidden=true;pintarTabla();
});

async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  $('login').hidden=!!session;$('app').hidden=!session;
  if(!session)return;
  cargarSecciones();
  try{
    data=await cargar();
    const media=data.length?(data.reduce((t,x)=>t+(x.your_rating||0),0)/data.length).toFixed(2):'–';
    $('stats').textContent=data.length+' títulos · nota media '+media;
    if($('n').options.length<2)for(let i=10;i>=1;i--){const o=document.createElement('option');o.value=i;o.textContent='Nota '+i;$('n').appendChild(o)}
    pintar();
  }catch(e){$('msg').textContent='No se pudo cargar: '+e.message}
}
$('login').addEventListener('submit',async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)$('lm').textContent=error.message;else iniciar();
});
$('out').addEventListener('click',async()=>{await sb.auth.signOut();iniciar()});

// ---- Añadir valoración (TMDb) ----
let elegido=null;
$('addb').addEventListener('click',()=>{$('add').hidden=!$('add').hidden;if(!$('add').hidden)$('tq').focus()});
async function tmdbCall(body){
  const {data:d,error}=await sb.functions.invoke('tmdb',{body});
  if(error)throw error;
  if(d&&d.error)throw new Error(d.error);
  return d;
}
async function buscar(){
  const q=$('tq').value.trim();if(!q)return;
  $('tmsg').textContent='Buscando…';$('tsel').hidden=true;elegido=null;
  try{
    const {results}=await tmdbCall({q});
    $('tmsg').textContent=results.length?'':'Sin resultados';
    $('tres').innerHTML=results.map(r=>`<div class="res" data-id="${r.id}" data-type="${r.type}">
      <img src="${r.poster||''}" alt=""><div><div class="t">${esc(r.title)}</div><div class="m">${r.year||''} · ${r.type==='tv'?'Serie':'Película'}</div></div></div>`).join('');
  }catch(e){$('tmsg').textContent='Error: '+e.message}
}
$('tgo').addEventListener('click',buscar);
$('tq').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
$('tres').addEventListener('click',async e=>{
  const el=e.target.closest('.res');if(!el)return;
  $('tmsg').textContent='Cargando ficha…';
  try{
    elegido=await tmdbCall({id:Number(el.dataset.id),type:el.dataset.type});
    $('tres').innerHTML='';$('tmsg').textContent='';
    $('tinfo').textContent=elegido.title+(elegido.year?' ('+elegido.year+')':'')+' — elige tu nota:';
    $('tnotas').innerHTML=[...Array(10)].map((_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('');
    $('tsel').hidden=false;
  }catch(err){$('tmsg').textContent='Error: '+err.message}
});
$('tnotas').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!elegido)return;
  const row={...elegido,your_rating:Number(b.dataset.n),date_rated:new Date().toISOString().slice(0,10)};
  const {error}=await sb.from('imdb_ratings').upsert(row,{onConflict:'const'});
  if(error){$('tmsg').textContent='No se pudo guardar: '+error.message;return}
  $('tmsg').textContent='Guardado: '+row.title+' → '+row.your_rating;
  $('tsel').hidden=true;elegido=null;$('tq').value='';
  data=await cargar();pintar();
  $('stats').textContent=data.length+' títulos · nota media '+(data.reduce((t,x)=>t+(x.your_rating||0),0)/data.length).toFixed(2);
});

iniciar();
['q','o','n'].forEach(id=>$(id).addEventListener('input',pintar));
</script>
</body>
</html>
