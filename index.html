<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>DGP</title>
<style>
:root{--bg:#0a0c11;--s1:#11141b;--s2:#181c26;--bd:rgba(255,255,255,.09);--tx:#eef0f5;--mut:#98a1b5;--ac:#ffb81c;--warn:#ffb81c;--pos:#35d39a;--neg:#ff7070;--r:14px;--glow:rgba(255,184,28,.08);--c1:#6c8cff;--c2:#35d39a;--c3:#ffb81c;--c4:#ff7070}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--s1:#fff;--s2:#f7f8fb;--bd:rgba(15,20,35,.11);--tx:#10131a;--mut:#58627a;--ac:#946100;--warn:#946100;--pos:#0e7c57;--neg:#c42b2b;--glow:rgba(148,97,0,.07);--c1:#3d5fe0;--c2:#0e7c57;--c3:#946100;--c4:#c42b2b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 85% -8%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.015em}
input,select{width:100%;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font:inherit;margin:0}
input::placeholder{color:var(--mut)}
button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;padding:8px 4px;cursor:pointer;border-radius:10px}
button:hover{filter:brightness(1.2)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.m{color:var(--mut);font-size:.86rem}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{padding:16px 16px 96px;max-width:1180px;width:100%;margin:0 auto}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.mhead h1{font-size:1.5rem}
.kbtn{display:none;border:1px solid var(--bd);color:var(--mut);font-weight:500;padding:8px 14px;border-radius:12px;background:var(--s1)}
.kbtn b{color:var(--tx);font-weight:600;margin-left:10px;font-size:.78rem;border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--s1);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-weight:500;font-size:.72rem;padding:6px 2px;border-top:2px solid transparent;border-radius:0}
.tabbar button.on{color:var(--tx);border-top-color:var(--ac)}
.tabbar button.on svg{color:var(--ac)}
.mini{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
@media(min-width:900px){
 .shell{grid-template-columns:240px 1fr}
 .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--bd);background:linear-gradient(180deg,var(--s1),transparent)}
 .brand{font-weight:800;font-size:1.3rem;letter-spacing:.04em;padding:0 10px 18px}
 .side nav{display:flex;flex-direction:column;gap:2px}
 .side nav button{display:flex;align-items:center;gap:12px;color:var(--mut);font-weight:600;padding:10px 12px;text-align:left;border:1px solid transparent;border-radius:12px}
 .side nav button:hover{background:var(--s2);filter:none}
 .side nav button.on{color:var(--tx);border-color:var(--ac)}
 .side nav button.on svg{color:var(--ac)}
 .side .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
 .main{padding:28px 36px 48px}
 .tabbar{display:none}
 .kbtn{display:inline-flex;align-items:center}
 .mini{display:none}
}
.tabs{display:flex;flex-wrap:wrap;gap:2px 6px;border-bottom:1px solid var(--bd);margin:0 0 14px}
.tab{color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.tab .bd{margin-left:6px;font-size:.78rem;color:var(--warn)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .grow{flex:1 1 240px}
.seg2{display:inline-flex;gap:4px;border:1px solid var(--bd);border-radius:999px;padding:3px;background:var(--s1)}
.seg2 button{color:var(--mut);font-weight:600;padding:6px 14px;border:1px solid transparent;border-radius:999px;font-size:.9rem}
.seg2 button.on{color:var(--tx);border-color:var(--ac)}
.chips{display:flex;gap:6px 8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:5px 13px;color:var(--tx);font-weight:500;font-size:.88rem}
.chip.on{border-color:var(--ac);font-weight:700}
.chip:hover{background:var(--s2);filter:none}
.hero{display:grid;grid-template-columns:1fr;gap:22px;padding:22px;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(155deg,var(--s2),var(--s1));margin-bottom:18px}
.hero .big{font-size:3.1rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 6px}
.chart{width:100%;height:150px;display:block}
.chartx{display:flex;justify-content:space-between}
.stk{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin:16px 0 10px;background:var(--bd)}
.stk i{display:block;min-width:3px}
.lg{display:grid;gap:2px}
.lgr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 8px;border-radius:10px;color:var(--tx);font-weight:500;width:100%;text-align:left}
.lgr:hover{background:var(--s2);filter:none}
.lgr span{display:flex;align-items:center;gap:10px}
.lgd{padding:2px 8px 8px 30px;display:grid;gap:2px}
.lgd .l2{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;padding:3px 0;border-bottom:1px solid var(--bd)}
.lgd .l2 span{overflow-wrap:anywhere}
.lgd .l2 b{white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
@media(min-width:900px){.hero{grid-template-columns:minmax(320px,1fr) 1.1fr;align-items:start}.hero .big{font-size:4rem}}
.sec{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:700;font-size:.95rem}
.sec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sec.ok::before{background:var(--pos)}
.sec .m{font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px 18px;align-items:center;padding:11px 14px 11px 16px;border:1px solid var(--bd);border-left:3px solid var(--bd);border-radius:var(--r);background:var(--s1);margin-bottom:8px;transition:opacity .2s,transform .2s,background .15s}
.row:hover{background:var(--s2)}
.row.pd{border-left-color:var(--warn)}
.row.ok{border-left-color:var(--pos)}
.row.out{opacity:0;transform:translateX(14px)}
.rmain{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.chev{flex:0 0 18px;color:var(--mut);transition:transform .2s;display:grid}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:hsl(var(--h) 55% 50%/.16);color:hsl(var(--h) 65% 66%)}
@media(prefers-color-scheme:light){.av{color:hsl(var(--h) 60% 32%)}}
.rt{flex:1 1 auto;min-width:0}
.rn{font-weight:600;overflow-wrap:anywhere}
.rs{color:var(--mut);font-size:.82rem}
.rs .st{font-weight:700}
.ra{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.dos{grid-template-columns:repeat(2,1fr)}
.seg button{border:1px solid var(--bd);border-radius:999px;padding:7px 10px;color:var(--tx);font-weight:500;font-size:.88rem;white-space:nowrap}
.seg button:hover{background:var(--s2);filter:none}
.seg button.on{border-color:var(--ac);font-weight:700}
.rdet{grid-column:1/-1;border-top:1px solid var(--bd);padding-top:6px}
.mv{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 18px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.mv:first-child{border-top:0}
.mv .lnx{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mv .lnx .l{overflow-wrap:anywhere}
.mv .lnx b{white-space:nowrap}
@media(min-width:900px){
 .row{grid-template-columns:minmax(0,1fr) auto}
 .row .seg{width:380px}
 .row .seg.dos{width:250px}
 .mv{grid-template-columns:minmax(0,1fr) auto}
 .mv.solo{grid-template-columns:minmax(0,1fr)}
 .mv .seg{width:380px}
}
.more{display:block;margin:6px auto 0}
.vacio{padding:28px 12px;text-align:center;color:var(--mut)}
.rev{max-width:760px;margin:0 auto}
.rprog{height:6px;border-radius:999px;background:var(--bd);overflow:hidden;margin:6px 0 4px}
.rprog i{display:block;height:100%;background:var(--pos);border-radius:999px;transition:width .3s}
.rcard{border:1px solid var(--bd);border-left:3px solid var(--warn);border-radius:20px;background:linear-gradient(155deg,var(--s2),var(--s1));padding:22px;margin-top:14px}
.rcard .av{flex-basis:52px;width:52px;height:52px;font-size:1.3rem}
.rcard h2{font-size:1.5rem;overflow-wrap:anywhere}
.rcard .tot{font-size:2.2rem;font-weight:800;letter-spacing:-.025em;margin:10px 0 2px}
.rbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 8px}
.rbtn{border:1px solid var(--bd);border-radius:16px;padding:14px 12px;color:var(--tx);font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:1.02rem}
.rbtn:hover{border-color:var(--ac);filter:none}
.rbtn kbd{font:600 .74rem ui-monospace,monospace;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:1px 7px}
.rbtn small{color:var(--mut);font-weight:500;font-size:.78rem}
.racc{display:flex;gap:16px;flex-wrap:wrap}
.hint{display:none}
@media(min-width:900px){.rbtns{grid-template-columns:repeat(4,1fr)}.hint{display:block}}
.form{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;padding:14px;border:1px solid var(--bd);border-radius:var(--r);background:var(--s1)}
@media(min-width:900px){.form.pg{grid-template-columns:160px 1fr 160px auto;align-items:center}}
.pal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palbox{width:100%;max-width:580px;background:var(--s1);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.palbox input{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px 18px;background:transparent}
.palres{max-height:50vh;overflow:auto;padding:6px}
.palres button{display:flex;justify-content:space-between;width:100%;text-align:left;color:var(--tx);font-weight:500;padding:10px 12px;border-radius:10px}
.palres button.on,.palres button:hover{background:var(--s2);filter:none}
#login{max-width:360px;margin:18vh auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
#login h1{font-size:1.6rem}
.nota{flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:2px solid var(--ac);font-weight:800;display:grid;place-items:center}
.t{font-weight:600;color:var(--tx);text-decoration:none}
.res{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.res:hover{background:var(--s2)}
.res img{width:34px;height:50px;object-fit:cover;border-radius:6px;background:var(--bd)}
.nbtn{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.nbtn button{border:1px solid var(--bd);border-radius:999px;padding:6px 14px;color:var(--tx);font-weight:600}
.mv{transition:opacity .2s}.mv.out{opacity:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--pos);border-radius:14px;padding:10px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100vw - 24px)}
.toast .tx2{font-size:.9rem;overflow-wrap:anywhere}
.toast .und{display:flex;flex-direction:column;align-items:center;gap:2px}
.toast .und button{padding:2px 6px}
.toast .und .m{font-variant-numeric:tabular-nums}
.toast .tb{display:block;height:3px;border-radius:999px;background:var(--pos);width:100%;transform-origin:left;transition:transform 1s linear}
@media(min-width:900px){.toast{bottom:28px}}
@media(max-width:600px){.tab{padding:9px 7px;font-size:.9rem}.tabs{gap:0 2px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Acceso</h1>
  <input id="em" type="email" placeholder="Correo" aria-label="Correo" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
  <button>Entrar</button>
  <div id="lm" class="m" role="alert"></div>
</form>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand">DGP</div>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="foot"><span class="m"><span id="version">V1.13</span></span><button id="out">Salir</button></div>
  </aside>
  <div>
  <div class="main">
    <div class="mini"><b>DGP</b><button id="out2">Salir</button></div>
    <header class="mhead"><h1 id="ptitle"></h1><button class="kbtn" id="kbtn" aria-label="Buscar o ir a">Buscar o ir a <b>Ctrl K</b></button></header>

    <section id="v-deuda" hidden>
      <div class="hero" id="hero"></div>
      <div class="tabs" id="dtabs" role="tablist" aria-label="Apartados"></div>
      <div id="dtools"></div>
      <div id="dlist" aria-live="polite"></div>
    </section>

    <section id="v-tabla" hidden>
      <div class="tools">
        <input id="tq" class="grow" type="search" placeholder="Buscar" aria-label="Buscar">
        <div id="tord" class="tools" style="margin:0"></div>
        <button id="tall">Desplegar todo</button>
        <button id="tadd">Añadir registro</button>
      </div>
      <form id="tf" class="form" hidden></form>
      <div id="tstat" class="m" style="margin-bottom:8px"></div>
      <div id="tlista"></div>
    </section>

    <section id="v-imdb" hidden>
      <div class="tools">
        <input id="q" class="grow" type="search" placeholder="Buscar título, director o género" aria-label="Buscar título, director o género">
        <div id="ifil" class="tools" style="margin:0"></div>
        <button id="addb">Añadir valoración</button>
      </div>
      <div id="add" class="form" hidden>
        <div class="tools" style="margin:0"><input id="tq2" class="grow" type="search" placeholder="Buscar película o serie" aria-label="Buscar película o serie"><button id="tgo">Buscar</button></div>
        <div id="tres"></div>
        <div id="tsel" hidden><div id="tinfo" class="t"></div><div class="nbtn" id="tnotas"></div></div>
        <div id="tmsg" class="m"></div>
      </div>
      <div id="stats" class="m" style="margin-bottom:8px"></div>
      <div id="msg" class="vacio">Cargando</div>
      <div id="list"></div>
    </section>
  </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
</div>

<div class="toast" id="toast" hidden role="status"><span class="tx2" id="ttx"></span><div class="und"><button id="tund">Deshacer</button><span class="m" id="tcnt"></span><i class="tb" id="tbar"></i></div></div>
<div class="pal" id="pal" hidden role="dialog" aria-label="Buscar o ir a">
  <div class="palbox"><input id="palq" type="search" placeholder="Escribe una sección, un apartado o un comercio" aria-label="Buscar o ir a" autocomplete="off"><div class="palres" id="palres"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://qtnqupcfgooazjzkpmtx.supabase.co';
const ANON_KEY='sb_publishable_brvDWgh8e_IrS8NWDvt7xg_rbL2dqcd';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s;
const nf=(n,d)=>(Math.abs(n)<0.005?0:n).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'})+' €';
const f2=n=>nf(n,2),f0=n=>nf(Math.round(n),0);
const sg=n=>n<0?'neg':n>0?'pos':'';
const fesp=s=>s?s.split('-').reverse().join('/'):'';
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const av=s=>`<span class="av" style="--h:${hue(s)}" aria-hidden="true">${esc((String(s).trim()[0]||'?').toUpperCase())}</span>`;
const sb=supabase.createClient(SUPABASE_URL,ANON_KEY,{db:{schema:'personal'}});
const ic=d=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const CHEV='<span class="chev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>';
const ICONOS={deuda:'M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9H5a2 2 0 0 1-2-2zM16 13h2',casa:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',corazon:'M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z',film:'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4',tabla:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'};
const icoSec=s=>ic(s.tipo==='deuda'?ICONOS.deuda:s.tipo==='imdb'?ICONOS.film:/vivir|casa|hogar/i.test(s.slug)?ICONOS.casa:/felic/i.test(s.slug)?ICONOS.corazon:ICONOS.tabla);

/* ---- estado de pantalla en el servidor ---- */
const UI={};let uiT=null;const uiSucio=new Set();
async function cargarUI(){const {data}=await sb.from('ui_estado').select('*');(data||[]).forEach(r=>{UI[r.clave]=r.valor})}
function setUI(k,v){UI[k]=v;uiSucio.add(k);clearTimeout(uiT);uiT=setTimeout(guardarUI,400)}
async function guardarUI(){const ks=[...uiSucio];uiSucio.clear();if(!ks.length)return;
  await sb.from('ui_estado').upsert(ks.map(k=>({clave:k,valor:UI[k],actualizado:new Date().toISOString()})),{onConflict:'clave'})}

/* ---- secciones ---- */
let secs=[],sec=null;
async function cargarSecciones(){
  const {data:r,error}=await sb.from('secciones').select('*').order('orden');
  if(error){$('ptitle').textContent='No se pudieron cargar las secciones';return}
  secs=r;
  const items=secs.map(s=>`<button data-s="${s.slug}" aria-pressed="false">${icoSec(s)}<span>${esc(s.nombre)}</span></button>`).join('');
  $('nav').innerHTML=items;$('tabbar').innerHTML=items;
  abrir((secs.find(s=>s.slug===UI.seccion)||secs[0]||{}).slug);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b&&(b.closest('#nav')||b.closest('#tabbar')))abrir(b.dataset.s)});
async function abrir(slug){
  sec=secs.find(s=>s.slug===slug);if(!sec)return;
  if(UI.seccion!==slug)setUI('seccion',slug);
  document.querySelectorAll('[data-s]').forEach(b=>{const on=b.dataset.s===slug;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  $('ptitle').textContent=sec.nombre;
  const t=sec.tipo;
  $('v-deuda').hidden=t!=='deuda';$('v-imdb').hidden=t!=='imdb';$('v-tabla').hidden=(t==='imdb'||t==='deuda');
  window.scrollTo(0,0);
  if(t==='imdb')return montarImdb();
  if(t==='deuda')return cargarDeuda();
  return cargarTabla();
}

/* ================= DEUDA ================= */
const NT={comp:'Compartido',mio:'Mío',diana:'Solo Diana',ign:'Ignorar'};
const OPT_T=[['comp','Compartido','1'],['mio','Mío','2'],['diana','Solo Diana','3'],['ign','Ignorar','4']];
const TIPOS_MOV=['pend','comp','mio','diana','ign'];
const TABS=[['r','Revisar'],['g','Comercios'],['m','Movimientos'],['a','Anterior'],['q','Alquiler'],['p','Pagos']];
let dr=[],dq='',lim=60,omitidos=new Set(),deshacer=[];
const abiertas=new Set();
const dTab=()=>UI.deuda_tab||'r';
const dEst=()=>UI.deuda_est||'p';
const dCat=()=>UI.deuda_cat||'';
function irA(tab,est){setUI('deuda_tab',tab);if(est)setUI('deuda_est',est);lim=60;pintarTabsD();pintarToolsD();pintarLista()}

async function cargarDeuda(){
  $('hero').innerHTML='<div class="m">Cargando</div>';
  let all=[],from=0;
  while(true){
    const {data:r,error}=await sb.from('registros').select('*').eq('seccion_id',sec.id).range(from,from+999);
    if(error){$('hero').innerHTML='<div class="m">Error: '+esc(error.message)+'</div>';return}
    all=all.concat(r);if(r.length<1000)break;from+=1000;
  }
  dr=all;pintarHero();pintarTabsD();pintarToolsD();pintarLista();
}
function mesesAlq(hasta){
  const c=sec.config||{},[y,m]=(c.alquiler_desde||'2025-12').split('-').map(Number),h=hasta||new Date(),L=[];
  for(let a=y,b=m;a*12+b<=h.getFullYear()*12+h.getMonth()+1;b++){if(b>12){b=1;a++}L.push([a,b])}
  return L;
}
const mes=x=>x?cap(new Date(x[0],x[1]-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})):'';
function resumenDeuda(){
  const c=sec.config||{};
  const S=t=>dr.filter(r=>r.datos.t===t&&!r.datos.s).reduce((a,r)=>a+Number(r.datos.i),0);
  const previo=S('previo'),comp=-S('comp')/2,mio=-S('mio'),pagos=S('pago');
  const meses=mesesAlq().length,alq=meses*(c.alquiler||0);
  const pend=dr.filter(r=>r.datos.t==='pend');
  const saldado=dr.filter(r=>r.datos.s&&r.datos.t==='previo').reduce((a,r)=>a+Number(r.datos.i),0);
  return {previo,alq,meses,comp,mio,pagos,saldado,total:previo+alq+comp+mio-pagos,np:pend.length,pendSum:pend.reduce((a,r)=>a+Math.max(0,-Number(r.datos.i)),0)};
}
function serie(){
  const c=sec.config||{},im=c.alquiler||0,h=new Date(),S=[];
  const base=dr.filter(r=>r.datos.t==='previo'&&!r.datos.s).reduce((a,r)=>a+Number(r.datos.i),0);
  for(let d=new Date(2025,10,1);d.getFullYear()*12+d.getMonth()<=h.getFullYear()*12+h.getMonth();d.setMonth(d.getMonth()+1)){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),dh=new Date(d.getFullYear(),d.getMonth(),1);
    let v=base+mesesAlq(dh).length*im;
    dr.forEach(r=>{const x=r.datos,fm=(x.f||'').slice(0,7);
      if(x.s||!x.f||fm>k)return;
      if(x.t==='comp')v+=-Number(x.i)/2;else if(x.t==='mio')v+=-Number(x.i);else if(x.t==='pago')v-=Number(x.i)});
    S.push([dh,v]);
  }
  return S;
}
let bigPrev=0;
function contar(el,a,b){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||Math.abs(a-b)<1){el.textContent=f0(b);return}
  const t0=performance.now(),dur=600;
  (function paso(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=f0(a+(b-a)*e);if(p<1)requestAnimationFrame(paso)})(t0);
}
/* detalle desplegable de cada componente de la deuda */
function detalleComp(k){
  const l2=(a,b,c)=>`<div class="l2"><span>${a}</span><b class="num ${c||''}">${b}</b></div>`;
  const ir=t=>`<button data-go="${t}" style="justify-self:start">Abrir apartado</button>`;
  if(k==='a'){const L=dr.filter(r=>r.datos.t==='previo'&&!r.datos.s).sort((a,b)=>String(a.datos.f||'').localeCompare(String(b.datos.f||'')));return L.map(r=>l2(esc(cap(r.datos.c))+' · '+(fesp(r.datos.f)||'sin fecha'),f2(Number(r.datos.i)))).join('')+ir('a')}
  if(k==='q'){const c=sec.config||{},ms=mesesAlq();return l2(ms.length+' meses de '+f0(c.alquiler||0),f0(ms.length*(c.alquiler||0)))+l2('Desde',mes(ms[0]))+ir('q')}
  if(k==='g'||k==='m'){
    const tt=k==='g'?'comp':'mio',f=k==='g'?0.5:1;
    const G=grupos().map(g=>({g,v:g.rs.filter(r=>r.datos.t===tt).reduce((a,r)=>a-Number(r.datos.i),0)*f})).filter(x=>x.v).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
    return (G.length?G.slice(0,12).map(x=>l2(esc(cap(x.g.g)),f2(x.v))).join('')+(G.length>12?`<div class="m">y ${G.length-12} más</div>`:''):'<div class="m">Todavía no has clasificado nada aquí.</div>')+ir('g')}
  if(k==='p'){const L=dr.filter(r=>r.datos.t==='pago');return (L.length?L.map(r=>l2(esc(cap(r.datos.c))+' · '+fesp(r.datos.f),f2(Number(r.datos.i)),'pos')).join(''):'<div class="m">Aún no hay pagos.</div>')+ir('p')}
  if(k==='s'){return dr.filter(r=>r.datos.t==='previo'&&r.datos.s).map(r=>l2(esc(cap(r.datos.c)),f2(Number(r.datos.i)))).join('')+ir('a')}
  return '';
}
function pintarHero(){
  const R=resumenDeuda();
  const S=serie(),vs=S.map(x=>x[1]),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const W=600,H=150,P=8,pts=S.map((x,i)=>[S.length>1?i/(S.length-1)*W:W,H-P-((x[1]-mn)/rg)*(H-2*P)]);
  const ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const area=ln+`L${W} ${H}L0 ${H}Z`;
  const comp=[['a','Deuda anterior',R.previo,'var(--c1)'],['q','Alquiler',R.alq,'var(--c2)'],['g','Compartidos, tu mitad',R.comp,'var(--c3)'],['m','Tuyos al 100 %',R.mio,'var(--c4)'],['p','Pagos que le has hecho',-R.pagos,'var(--pos)']];
  if(R.saldado)comp.push(['s','Deuda anterior ya saldada',R.saldado,'var(--mut)']);
  const tot=comp.slice(0,4).reduce((a,x)=>a+Math.max(0,x[2]),0)||1;
  const lgr=comp.map(x=>{const k='h:'+x[0],ab=abiertas.has(k);return `<div><button class="lgr" data-hk="${x[0]}" aria-expanded="${ab}"><span><i class="dot" style="background:${x[3]}"></i>${x[1]}</span><span><b class="num">${f0(x[2])}</b>${CHEV}</span></button><div class="lgd" ${ab?'':'hidden'}>${ab?detalleComp(x[0]):''}</div></div>`}).join('');
  $('hero').innerHTML=`<div>
    <div class="m">Debes a Diana</div><div class="big num" id="dbig">${f0(bigPrev)}</div>
    <div class="m">${R.np?`<button data-go="r" style="padding:0;text-align:left"><span class="warn">${R.np} movimientos por revisar</span></button>, ${f0(R.pendSum)} en gastos que aún no cuentan.`:'Todo revisado.'}</div>
    <div class="stk" role="img" aria-label="Composición de la deuda">${comp.slice(0,4).map(x=>`<i style="flex:${Math.max(0,x[2])/tot};background:${x[3]}"></i>`).join('')}</div>
    <div class="lg">${lgr}</div>
  </div>
  <div><div class="m" style="margin-bottom:6px">Evolución mensual de la deuda</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución de la deuda por mes">
      <defs><linearGradient id="gr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#gr)"/><path d="${ln}" fill="none" stroke="var(--ac)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="chartx m"><span>${mes([S[0][0].getFullYear(),S[0][0].getMonth()+1])}</span><span>${mes([S[S.length-1][0].getFullYear(),S[S.length-1][0].getMonth()+1])}</span></div>
  </div>`;
  contar($('dbig'),bigPrev,R.total);bigPrev=R.total;
}
$('hero').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const t=g.dataset.go;irA(t,(t==='g'||t==='m'||t==='a')?'t':null);$('dtabs').scrollIntoView({behavior:'smooth',block:'start'});return}
  const h=e.target.closest('[data-hk]');
  if(h){const k='h:'+h.dataset.hk,d=h.nextElementSibling,ab=d.hidden;d.hidden=!ab;h.setAttribute('aria-expanded',ab);
    if(ab){abiertas.add(k);d.innerHTML=detalleComp(h.dataset.hk)}else{abiertas.delete(k);d.innerHTML=''}}
});

function grupos(){
  const G={};
  dr.filter(r=>!['previo','pago'].includes(r.datos.t)).forEach(r=>{
    const g=G[r.datos.g]??={g:r.datos.g,cat:r.datos.cat,n:0,tot:0,t:new Set(),rs:[]};
    g.rs.push(r);g.n++;g.tot+=Number(r.datos.i);g.t.add(r.datos.t);
  });
  return Object.values(G).map(g=>{g.pend=g.t.has('pend');g.cur=g.pend?'pend':(g.t.size>1?'mixto':[...g.t][0]);g.rs.sort((a,b)=>String(b.datos.f).localeCompare(String(a.datos.f)));return g});
}
const rango=g=>{const f=g.rs.map(r=>r.datos.f).filter(Boolean).sort();return f.length?(f[0]===f[f.length-1]?fesp(f[0]):fesp(f[0])+' a '+fesp(f[f.length-1])):''};
function cuentas(){
  const G=grupos(),m=dr.filter(r=>r.datos.t==='pend');
  return {r:G.filter(g=>g.pend).length,g:G.filter(g=>g.pend).length,m:m.length,a:dr.filter(r=>r.datos.t==='previo'&&r.datos.s===undefined).length};
}
function pintarTabsD(){
  const cn=cuentas();
  $('dtabs').innerHTML=TABS.map(([k,t])=>`<button class="tab ${dTab()===k?'on':''}" role="tab" aria-selected="${dTab()===k}" data-dt="${k}">${t}${cn[k]?`<span class="bd">${cn[k]}</span>`:''}</button>`).join('');
}
$('dtabs').addEventListener('click',e=>{const b=e.target.closest('[data-dt]');if(b)irA(b.dataset.dt)});
function pintarToolsD(){
  const t=dTab(),est=dEst();
  if(t==='r'||t==='q'||t==='p'){$('dtools').innerHTML='';return}
  const cats=[...new Set(dr.map(r=>r.datos.cat).filter(Boolean))].filter(c=>!['Saldo previo','Pago'].includes(c)).sort((a,b)=>a.localeCompare(b,'es'));
  const cn=cuentas(),pn=t==='a'?cn.a:(t==='g'?cn.g:cn.m);
  $('dtools').innerHTML=`<div class="tools"><input id="dq" class="grow" type="search" placeholder="Buscar" aria-label="Buscar en Deuda Diana" value="${esc(dq)}">
    <div class="seg2" role="group" aria-label="Estado">${[['p','Por revisar'+(pn?' · '+pn:'')],['r','Revisados'],['t','Todos']].map(([k,l])=>`<button data-est="${k}" class="${est===k?'on':''}" aria-pressed="${est===k}">${l}</button>`).join('')}</div>
    <button data-all>Desplegar todo</button></div>`+
    (t==='a'?'':`<div class="chips">${['',...cats].map(c=>`<button class="chip ${dCat()===c?'on':''}" data-cat="${esc(c)}" aria-pressed="${dCat()===c}">${c?esc(c):'Todas las categorías'}</button>`).join('')}</div>`);
}
$('dtools').addEventListener('input',e=>{if(e.target.id==='dq'){dq=e.target.value;lim=60;pintarLista()}});
$('dtools').addEventListener('click',e=>{
  const s=e.target.closest('[data-est]');if(s){setUI('deuda_est',s.dataset.est);lim=60;pintarToolsD();pintarLista();return}
  const c=e.target.closest('[data-cat]');if(c){setUI('deuda_cat',c.dataset.cat);lim=60;pintarToolsD();pintarLista();return}
  const a=e.target.closest('[data-all]');if(a){const abrir=a.textContent==='Desplegar todo';desplegarTodo($('dlist'),abrir);a.textContent=abrir?'Plegar todo':'Desplegar todo'}
});
function desplegarTodo(cont,abrir){
  cont.querySelectorAll('.row').forEach(row=>{const tg=row.querySelector('[data-tog]');if(!tg)return;
    const det=row.querySelector('.rdet');if(!det||det.hidden===!abrir)return;toggleFila(tg,abrir)});
}

/* piezas de fila */
const seg=(lista,sel,attr,cls)=>`<div class="seg ${cls||''}" role="group">${lista.map(([v,t])=>`<button class="${String(v)===String(sel)?'on':''}" aria-pressed="${String(v)===String(sel)}" ${attr} data-v="${v}">${t}</button>`).join('')}</div>`;
const campos=L=>L.filter(x=>x[1]!==''&&x[1]!=null).map(([a,b,c])=>`<div class="mv solo"><div class="lnx"><span class="m">${a}</span><b class="num ${c||''}">${b}</b></div></div>`).join('');
function filaMov(r){
  const i=Number(r.datos.i),at='data-id="'+r.id+'"';
  return `<div class="mv"><div class="lnx"><span class="l">${fesp(r.datos.f)}${r.datos.d?' · '+esc(r.datos.d):''}${r.datos.t==='pend'?' · <b class="warn">Por revisar</b>':''}</span><b class="num ${sg(i)}">${f2(i)}</b></div>${seg(OPT_T,r.datos.t,at)}</div>`;
}
const cab=(k,av_,tit,sub,imp,cl,ab,exp=true)=>exp?`<div class="rmain" data-tog tabindex="0" role="button" aria-expanded="${ab}">${av_}<div class="rt"><div class="rn">${tit}</div><div class="rs">${sub}</div></div><div class="ra ${cl||''}">${imp}</div>${CHEV}</div>`:`<div class="rmain" style="cursor:default">${av_}<div class="rt"><div class="rn">${tit}</div><div class="rs">${sub}</div></div><div class="ra ${cl||''}">${imp}</div></div>`;
function detalleG(g){
  const pe=g.rs.filter(r=>r.datos.t==='pend'),he=g.rs.filter(r=>r.datos.t!=='pend');
  if(!g.pend)return he.slice(0,150).map(filaMov).join('');
  const k='rv:'+g.g,ab=abiertas.has(k);
  return pe.slice(0,150).map(filaMov).join('')+(he.length?`<button data-hech="${encodeURIComponent(g.g)}" aria-expanded="${ab}" style="justify-self:start">${ab?'Ocultar revisados':'Ver revisados ('+he.length+')'}</button><div ${ab?'':'hidden'}>${he.slice(0,150).map(filaMov).join('')}</div>`:'');
}
function filaG(g){
  const k='g:'+g.g,ab=abiertas.has(k),at='data-g="'+encodeURIComponent(g.g)+'"';
  const uno=g.n===1;
  return `<article class="row ${g.pend?'pd':'ok'}" data-k="${esc(k)}">${cab(k,av(g.g),esc(cap(g.g)),`${g.pend?'<b class="st warn">Por revisar</b> · ':(g.cur==='mixto'?'<b class="st">Reparto mixto</b> · ':'')}${esc(g.cat)} · ${uno?'1 movimiento · '+fesp(g.rs[0].datos.f)+(g.rs[0].datos.d?' · '+esc(g.rs[0].datos.d):''):g.n+' movimientos · '+rango(g)}`,f2(g.tot),sg(g.tot),ab&&!uno,!uno)}${seg(OPT_T,g.cur,at)}${uno?'':`<div class="rdet" ${ab?'':'hidden'}>${ab?detalleG(g):''}</div>`}</article>`;
}
function filaM(r){
  const i=Number(r.datos.i),pd=r.datos.t==='pend',at='data-id="'+r.id+'"',k='m:'+r.id,ab=abiertas.has(k);
  return `<article class="row ${pd?'pd':'ok'}" data-k="${k}">${cab(k,av(r.datos.c),esc(cap(r.datos.c)),`${pd?'<b class="st warn">Por revisar</b> · ':''}${fesp(r.datos.f)} · ${esc(r.datos.cat)}`,f2(i),sg(i),ab)}${seg(OPT_T,r.datos.t,at)}<div class="rdet" ${ab?'':'hidden'}>${campos([['Fecha',fesp(r.datos.f)],['Concepto',esc(r.datos.c)],['Detalle del banco',esc(r.datos.d||'')],['Categoría',esc(r.datos.cat||'')],['Comercio agrupado',esc(cap(r.datos.g||''))],['Importe',f2(i),sg(i)],['Reparto',r.datos.t==='pend'?'Por revisar':NT[r.datos.t]]])}</div></article>`;
}
function filaA(r){
  const i=Number(r.datos.i),un=r.datos.s===undefined,k='a:'+r.id,ab=abiertas.has(k);
  return `<article class="row ${un?'pd':'ok'}" data-k="${k}">${cab(k,av(r.datos.c),esc(cap(r.datos.c)),`${un?'<b class="st warn">Por revisar</b> · ':''}${fesp(r.datos.f)||'Sin fecha'}`,f2(i),'',ab)}${seg([[true,'Saldado'],[false,'Aún lo debo']],un?'':r.datos.s,'data-id="'+r.id+'" data-k="s"','dos')}<div class="rdet" ${ab?'':'hidden'}>${campos([['Concepto',esc(r.datos.c)],['Fecha',fesp(r.datos.f)||'Sin fecha'],['Importe',f2(i)],['Estado',un?'Por revisar':(r.datos.s?'Saldado, no cuenta':'Aún lo debes, cuenta')]])}</div></article>`;
}
const pasaEst=pd=>dEst()==='t'||(dEst()==='p'?pd:!pd);
function cabeceras(items,pdf,pinta){
  const A=items.filter(pdf),B=items.filter(x=>!pdf(x)),est=dEst();
  let h='',n=0;
  const trozo=(X,t,cls)=>{if(!X.length)return;h+=`<div class="sec ${cls}">${t} <span class="m">${X.length}</span></div>`;const k=Math.min(X.length,Math.max(0,lim-n));X.slice(0,k).forEach(x=>{h+=pinta(x)});n+=k};
  trozo(A,'Por revisar','');trozo(B,'Revisados','ok');
  if(n<A.length+B.length)h+=`<button class="more" data-more>Mostrar más (${A.length+B.length-n})</button>`;
  return h||'<div class="vacio">'+(est==='p'?'No queda nada por revisar aquí.':'No hay nada que mostrar con este filtro.')+'</div>';
}
function pintarLista(){
  const t=dTab(),q=dq.toLowerCase().trim(),cat=dCat();
  let h='';
  if(t==='r')return pintarRevisar();
  if(t==='g'){
    let L=grupos().filter(g=>(!cat||g.cat===cat)&&(!q||g.g.includes(q)||g.rs.some(r=>(r.datos.c+' '+(r.datos.d||'')).toLowerCase().includes(q)))&&pasaEst(g.pend));
    L.sort((a,b)=>Math.abs(b.tot)-Math.abs(a.tot));
    h=cabeceras(L,g=>g.pend,filaG);
  }else if(t==='m'){
    let L=dr.filter(r=>!['previo','pago'].includes(r.datos.t)&&(!cat||r.datos.cat===cat)&&(!q||(r.datos.c+' '+(r.datos.d||'')+' '+r.datos.g).toLowerCase().includes(q))&&pasaEst(r.datos.t==='pend'));
    L.sort((a,b)=>String(b.datos.f).localeCompare(String(a.datos.f)));
    h=cabeceras(L,r=>r.datos.t==='pend',filaM);
  }else if(t==='a'){
    const P=dr.filter(r=>r.datos.t==='previo'),deb=P.filter(r=>!r.datos.s).reduce((x,r)=>x+Number(r.datos.i),0),sal=P.filter(r=>r.datos.s).reduce((x,r)=>x+Number(r.datos.i),0);
    let L=P.filter(r=>(!q||(r.datos.c).toLowerCase().includes(q))&&pasaEst(r.datos.s===undefined));
    L.sort((a,b)=>String(a.datos.f||'').localeCompare(String(b.datos.f||'')));
    h=`<div class="m" style="margin-bottom:6px">Deuda acumulada hasta el 19/11/2025. Aún debes <b class="num">${f0(deb)}</b>; saldado <b class="num">${f0(sal)}</b>. Pulsa de nuevo la opción elegida para volver a por revisar.</div>`+cabeceras(L,r=>r.datos.s===undefined,filaA);
  }else if(t==='q'){
    const c=sec.config||{},ms=mesesAlq(),im=c.alquiler||0;
    h=`<div class="m" style="margin-bottom:10px">${ms.length} meses de ${f0(im)}, la mitad de ${f0(im*2)}. Empieza en ${mes(ms[0])}. Total: <b class="num">${f0(ms.length*im)}</b>.</div>`+
      ms.slice().reverse().map(x=>{const k='q:'+x.join('-'),ab=abiertas.has(k);return `<article class="row ok" data-k="${k}">${cab(k,av(mes(x)),mes(x),'Mitad del alquiler',f2(im),'',ab)}<div class="rdet" ${ab?'':'hidden'}>${campos([['Mes',mes(x)],['Alquiler total',f2(im*2)],['Tu mitad',f2(im)],['Forma de pago','Efectivo, sin rastro en el banco']])}</div></article>`}).join('');
  }else{
    const L=dr.filter(r=>r.datos.t==='pago').sort((a,b)=>String(b.datos.f||'').localeCompare(String(a.datos.f||'')));
    h=`<form class="form pg" id="pf"><input name="f" type="date" required aria-label="Fecha"><input name="c" placeholder="Concepto" aria-label="Concepto"><input name="i" placeholder="Importe en euros" inputmode="decimal" aria-label="Importe en euros" required><button>Añadir pago</button></form>`+

async function aplicarGrupo(g,v){
  const rs=dr.filter(r=>r.datos.g===g&&TIPOS_MOV.includes(r.datos.t));

  rs.forEach(r=>r.datos={...r.datos,t:v});

  if(error){prev.forEach(([r,d])=>r.datos=d);alert(error.message);return null}

}
async function revisarAccion(a){

  if(a==='z'){
    await deshacerUltimo();return;

  const g=cola[0].g,prev=await aplicarGrupo(g,a);

    const {results}=await tmdbCall({q});
    $('tmsg').textContent=results.length?'':'Sin resultados';
    $('tres').innerHTML=results.map(r=>`<div class="res" data-id="${r.id}" data-type="${r.type}" tabindex="0" role="button"><img src="${esc(r.poster||'')}" alt=""><div><div class="t">${esc(r.title)}</div><div class="m">${r.year||''} · ${r.type==='tv'?'Serie':'Película'}</div></div></div>`).join('');
  }catch(e){$('tmsg').textContent='Error: '+e.message}
}
$('tgo').addEventListener('click',buscar);
$('tq2').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
$('tres').addEventListener('click',async e=>{
  const el=e.target.closest('.res');if(!el)return;
  $('tmsg').textContent='Cargando ficha';
  try{
    elegido=await tmdbCall({id:Number(el.dataset.id),type:el.dataset.type});
    $('tres').innerHTML='';$('tmsg').textContent='';
    $('tinfo').textContent=elegido.title+(elegido.year?' ('+elegido.year+')':'')+': elige tu nota';
    $('tnotas').innerHTML=[...Array(10)].map((_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('');
    $('tsel').hidden=false;
  }catch(err){$('tmsg').textContent='Error: '+err.message}
});
$('tnotas').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!elegido)return;
  const row={...elegido,your_rating:Number(b.dataset.n),date_rated:new Date().toISOString().slice(0,10)};
  const {error}=await sb.from('imdb_ratings').upsert(row,{onConflict:'const'});
  if(error){$('tmsg').textContent='No se pudo guardar: '+error.message;return}
  $('tmsg').textContent='Guardado: '+row.title+', nota '+row.your_rating;
  $('tsel').hidden=true;elegido=null;$('tq2').value='';
  data=await cargarImdb();statsImdb();pintarImdb();
});

/* ================= acceso ================= */
async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  $('login').hidden=!!session;$('app').hidden=!session;
  if(!session)return;
  await cargarUI();
  cargarSecciones();
}
$('login').addEventListener('submit',async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)$('lm').textContent=error.message;else iniciar();
});
const salir=async()=>{await guardarUI();await sb.auth.signOut();iniciar()};
$('out').addEventListener('click',salir);$('out2').addEventListener('click',salir);
iniciar();
</script>
</body>
