async function cab(){ try{ if(!sbc) return null; const {data:{session}}=await sbc.auth.getSession(); return session?{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}:null; }catch(e){ return null; } }
let tSub=0;
function guardar(sinTs){ if(!sinTs){ S.ts=Date.now(); subir(); } guardarLocal(); }
function subir(ya){
  clearTimeout(tSub);
  tSub=setTimeout(async()=>{
    try{
      const H=await cab(); if(!H) return;
      const cuerpo=JSON.stringify([{clave:KS,valor:S,actualizado:new Date().toISOString()}]);
      await fetch(SB_URL+'?on_conflict=clave',{method:'POST',keepalive:cuerpo.length<60000,headers:Object.assign({'Content-Type':'application/json','Content-Profile':'personal',Prefer:'resolution=merge-duplicates,return=minimal'},H),body:cuerpo});
    }catch(e){}
  },ya?0:1200);
}
async function sincronizar(){
  try{
    const H=await cab(); if(!H) return;
    const r=await fetch(SB_URL+'?clave=eq.'+KS+'&select=valor',{headers:Object.assign({'Accept-Profile':'personal'},H)});
    if(!r.ok) return; const a=await r.json(), v=a[0]&&a[0].valor, ts=v&&v.ts||0;
    if(v&&v.partidas&&ts>(S.ts||0)){ S=v; if(!S.partidas[S.actual]) S.actual=Object.keys(S.partidas)[0]; guardarLocal(); if(S.actual) abrir(S.actual); else pintar(); }
    else if((S.ts||0)>ts) subir(true);
  }catch(e){}
}
/* ---------- selección y palabras ---------- */
const idx=(r,c)=>r*P.W+c;
function palabraEn(i,d){ const r=Math.floor(i/P.W), c=i%P.W; return P.pal.find(w=>w.d===d&&(d?(w.c===c&&r>=w.r&&r<w.r+w.len):(w.r===r&&c>=w.c&&c<w.c+w.len))); }
function celdas(w){ const a=[]; for(let k=0;k<w.len;k++) a.push(w.d?idx(w.r+k,w.c):idx(w.r,w.c+k)); return a; }
function actual(){ return P.sel>=0?palabraEn(P.sel,P.dir)||palabraEn(P.sel,1-P.dir):null; }
function tocar(i){
  if(P.pausa||!P.sol[i]) return;
  if(P.sel===i){ if(palabraEn(i,1-P.dir)) P.dir=1-P.dir; }
  else { P.sel=i; if(!palabraEn(i,P.dir)) P.dir=1-P.dir; }
  pintar();
}
function irPalabra(w){ P.dir=w.d; const cs=celdas(w); P.sel=cs.find(i=>!P.cur[i])??cs[0]; pintar(); }
function otra(s){ const w=actual(); let k=w?P.pal.indexOf(w):-1; k=(k+s+P.pal.length)%P.pal.length; irPalabra(P.pal[k]); }
function letra(L){
  if(!P||P.pausa||P.fin||P.sel<0) return;
  if(P.dado&&P.dado[P.sel]){ const w=actual(); if(w){ const cs=celdas(w),k=cs.indexOf(P.sel); const sig=cs.slice(k+1).find(i=>!P.cur[i]); if(sig!==undefined){ P.sel=sig; pintar(); } } return; }
  P.cur[P.sel]=L; P.mal=[]; msg('');
  const w=actual(); if(w){ const cs=celdas(w), k=cs.indexOf(P.sel); const sig=cs.slice(k+1).find(i=>!P.cur[i]); if(sig!==undefined) P.sel=sig; else if(k+1<cs.length) P.sel=cs[k+1]; }
  tras();
}
function borrar(){
  if(!P||P.pausa||P.fin||P.sel<0) return;
  P.mal=[]; msg('');
  if(P.cur[P.sel]){ if(!(P.dado&&P.dado[P.sel])) P.cur[P.sel]=''; }
  else { const w=actual(); if(w){ const cs=celdas(w), k=cs.indexOf(P.sel); if(k>0){ P.sel=cs[k-1]; if(!(P.dado&&P.dado[P.sel])) P.cur[P.sel]=''; } } }
  tras();
}
function tras(){ comprobarFin(); guardar(); pintar(); pintarLista(); }
function comprobarFin(){
  if(P.fin) return;
  const l=[]; P.sol.forEach((x,i)=>{ if(x) l.push(i); });
  if(!l.every(i=>P.cur[i])) return;
  const mal=l.filter(i=>P.cur[i]!==P.sol[i]);
  if(mal.length){ P.mal=mal; msg('Está completo pero hay '+mal.length+(mal.length===1?' letra mal, marcada en rojo.':' letras mal, marcadas en rojo.'),'err'); return; }
  P.fin=true; P.fecha=Date.now(); P.guardada=false; clearInterval(timer);
  msg(!P.rec?'Resuelto en '+fmtT(P.t)+'. Pon tus iniciales para guardar la marca.':P.t<P.rec.t?'Nueva mejor marca: '+fmtT(P.t)+'. Pon tus iniciales.':'Resuelto en '+fmtT(P.t)+'. La marca a batir sigue siendo '+fmtT(P.rec.t)+'.','ok');
}
function msg(t,k){ const m=$('msg'); m.textContent=t||''; m.className=k||''; }
/* ---------- pintar ---------- */
function pintar(){
  if(!P) return;
  const tab=$('tab'); tab.style.setProperty('--n',P.W); tab.classList.toggle('pausa',!!P.pausa);
  const w=actual(), ws=new Set(w?celdas(w):[]);
  let h='';
  for(let i=0;i<P.W*P.H;i++){
    if(!P.sol[i]){ h+='<div class="c k"></div>'; continue; }
    let k='c'; if(ws.has(i)) k+=' w'; if(i===P.sel) k+=' sel'; if(P.mal.includes(i)) k+=' mal'; if(P.fin) k+=' ok'; if(P.dado&&P.dado[i]) k+=' g';
    const r=Math.floor(i/P.W), c=i%P.W, ww=P.pal.find(x=>x.r===r&&x.c===c);
    h+='<div class="'+k+'" role="gridcell" data-i="'+i+'">'+(ww?'<i>'+ww.num+'</i>':'')+(P.cur[i]||'')+'</div>';
  }
  tab.innerHTML=h;
  $('pNum').textContent=w?w.num+' '+(w.d?'Vertical':'Horizontal')+' · '+w.len+' letras':'Elige una casilla';
  $('pTxt').textContent=w?w.clue:'';
  $('nom').textContent=P.nombre+' · '+NIV[P.nivel]+(P.fin?' · resuelto':P.pausa?' · en pausa':'');
  $('teclado').classList.toggle('pausa',!!(P.pausa||P.fin));
  $('rec').innerHTML=P.rec?'Marca a batir: <b>'+P.rec.ini+'</b> · '+fmtT(P.rec.t):'';
  $('fin').hidden=!P.fin;
  if(P.fin){ const mejora=!P.rec||P.t<P.rec.t; $('finForm').hidden=!(mejora&&!P.guardada); if(!$('ini').value) $('ini').value=S.ini||''; }
  $('bPausa').innerHTML=P.pausa?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  $('bPausa').disabled=P.fin; $('reloj').textContent=fmtT(P.t);
  const ls=(d)=>'<h2>'+(d?'Verticales':'Horizontales')+'</h2>'+P.pal.filter(x=>x.d===d).map(x=>'<button class="cl'+(w===x?' on':'')+'" data-k="'+P.pal.indexOf(x)+'"><b>'+x.num+'</b>'+x.clue+' <span style="color:var(--mut)">('+x.len+')</span></button>').join('');
  $('lh').innerHTML=ls(0); $('lv').innerHTML=ls(1);
}
function pintarLista(){
  const ids=Object.keys(S.partidas).sort((a,b)=>S.partidas[b].fecha-S.partidas[a].fecha);
  $('lista').innerHTML=ids.map(id=>{ const p=S.partidas[id], tot=p.sol.filter(x=>x).length, hechas=p.cur.filter(x=>x).length;
    return '<button data-id="'+id+'" class="'+(id===S.actual?'on':'')+'">'+p.nombre+' · '+NIV[p.nivel]+'<small>'+(p.fin?'Resuelto en '+fmtT(p.t):hechas+' de '+tot+' letras · '+fmtT(p.t))+(p.rec?' · marca '+p.rec.ini+' '+fmtT(p.rec.t):'')+'</small></button>'; }).join('')||'<p style="color:var(--mut)">Aún no hay ninguno.</p>';
}
function abrir(id){
  P=S.partidas[id]; if(!P) return; S.actual=id; P.mal=P.mal||[]; if(P.sel<0||!P.sol[P.sel]) { P.sel=P.sol.findIndex(x=>x); P.dir=P.pal[0]?P.pal[0].d:0; }
  guardarLocal(); msg(''); pintar(); pintarLista(); arrancar();
}
function arrancar(){
  clearInterval(timer);
  timer=setInterval(()=>{ if(!P||document.hidden||P.pausa||P.fin) return; P.t++; $('reloj').textContent=fmtT(P.t); if(P.t%10===0) guardarLocal(); },1000);
}
/* ---------- teclado y eventos ---------- */
(function(){
  const fil=['QWERTYUIOP','ASDFGHJKLÑ','ZXCVBNM'];
  $('teclado').innerHTML=fil.map((f,i)=>'<div class="f" style="'+(i===2?'grid-template-columns:repeat(9,1fr)':'')+'">'+f.split('').map(L=>'<button data-l="'+L+'">'+L+'</button>').join('')+(i===2?'<button data-l="" aria-label="Borrar" style="grid-column:span 2">⌫</button>':'')+'</div>').join('');
  $('teclado').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; b.dataset.l?letra(b.dataset.l):borrar(); });
})();
$('tab').addEventListener('click',e=>{ const c=e.target.closest('.c'); if(c&&c.dataset.i) tocar(+c.dataset.i); });
$('bPrev').onclick=()=>P&&!P.pausa&&otra(-1); $('bNext').onclick=()=>P&&!P.pausa&&otra(1);
$('bPausa').onclick=()=>{ if(!P||P.fin) return; P.pausa=!P.pausa; guardar(true); pintar(); };
$('bReinicio').onclick=()=>{
  const b=$('bReinicio');
  if(!tReinicio){ b.textContent='¿Seguro? Toca otra vez para borrar todo'; tReinicio=setTimeout(()=>{ tReinicio=0; b.textContent='Reiniciar'; },4000); return; }
  clearTimeout(tReinicio); tReinicio=0; b.textContent='Reiniciar'; reiniciar();
};
function reiniciar(){ P.cur=P.sol.map((x,i)=>(P.dado&&P.dado[i])?x:''); P.t=0; P.fin=false; P.pausa=false; P.mal=[]; P.guardada=false; msg(''); guardar(); pintar(); pintarLista(); arrancar(); }
$('bOtra').onclick=reiniciar;
$('ini').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-ZÑ]/g,'').slice(0,3); });
$('bGuardaMarca').onclick=()=>{
  const ini=$('ini').value.toUpperCase().replace(/[^A-ZÑ]/g,'');
  if(ini.length!==3){ msg('Escribe tres letras.','err'); return; }
  if(P.rec&&P.t>=P.rec.t) return;
  P.rec={ini,t:P.t,fecha:Date.now()}; P.guardada=true; S.ini=ini; msg('Marca guardada: '+ini+' · '+fmtT(P.t)+'.','ok'); guardar(); pintar(); pintarLista();
};
document.querySelector('.niv').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; b.disabled=true; setTimeout(()=>{ nueva(b.dataset.k); b.disabled=false; window.scrollTo(0,0); },20); });
$('lista').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ guardar(); abrir(b.dataset.id); window.scrollTo(0,0); } });
['lh','lv'].forEach(id=>$(id).addEventListener('click',e=>{ const b=e.target.closest('.cl'); if(b&&P&&!P.pausa){ irPalabra(P.pal[+b.dataset.k]); window.scrollTo(0,0); } }));
document.addEventListener('keydown',e=>{
  if(!P||e.metaKey||e.ctrlKey||e.altKey||(e.target&&e.target.tagName==='INPUT')) return;
  if(e.key==='Backspace'){ e.preventDefault(); borrar(); }
  else if(e.key==='Tab'){ e.preventDefault(); otra(e.shiftKey?-1:1); }
  else if(/^[a-zA-ZñÑ]$/.test(e.key)) letra(e.key.toUpperCase());
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ guardarLocal(); subir(true); } else sincronizar(); });
/* ---------- inicio ---------- */
cargar();
if(!S||!S.partidas){ S={actual:null,ts:0,cuenta:0,partidas:{}}; }
if(S.actual&&S.partidas[S.actual]) abrir(S.actual);
else { pintarLista(); nueva('facil'); }
sincronizar();
})();
</script>
<script>
/* Actualización automática: compara con version.json y recarga si hay versión nueva */
(function(){
  var BUILD='V2.82', ROOT='../../';
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){ intentos(intentos()+1); try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){} location.reload(); }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#1b1f2a;color:#eef0f5;border:1px solid rgba(255,255,255,.2);border-radius:12px;font:14px system-ui';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{ var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){ if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v); } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) comprobar(); });
})();
</script>
