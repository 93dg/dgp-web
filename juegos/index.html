<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='dgp-juegos';

/* ---------- tu sudoku (negrita = dado, resto = lo que ya habías puesto) ---------- */
const MIO_DADOS=['082053107','600800543','030000620','000008302','200935004','308200950','000000060','920010005','106480230'].join('');
const MIO_TUYOS=[[0,0,4],[0,3,6],[0,7,9],[2,8,8],[3,4,6],[4,1,6],[5,8,6],[6,0,8],[6,2,3],[6,3,5],[7,3,3],[7,5,6],[8,1,5],[8,5,7],[8,8,9]];

const MIO_NOTAS={10:'1379',11:'179',13:'279',14:'279',18:'46',20:'46',21:'79',22:'479',23:'479',27:'46',28:'468',29:'4679',34:'17',38:'17',42:'79',43:'7',46:'179',49:'47',50:'49',55:'47',58:'279',59:'279',60:'47',62:'1',65:'47',69:'47',70:'7'};
function unicos(p){ for(let i=0;i<81;i++){ const n=p.notas[i]; if(!p.cur[i]&&n&&!(n&(n-1))){ p.cur[i]=Math.log2(n)+1; p.notas[i]=0; } } }
function notasMio(p){
  for(const k in MIO_NOTAS){ const i=+k; if(p.cur[i]||p.notas[i]) continue; let m=0; for(const ch of MIO_NOTAS[k]) m|=1<<(+ch-1); p.notas[i]=m; }
  unicos(p); p.notasv=2;
}
/* ---------- resolver y generar ---------- */
const pop=m=>{let n=0;while(m){m&=m-1;n++;}return n;};
function resolver(g0,lim,azar){
  const a=g0.slice(), fil=new Array(9).fill(0), col=new Array(9).fill(0), caj=new Array(9).fill(0);
  for(let i=0;i<81;i++) if(a[i]){ const b=1<<(a[i]-1); fil[(i/9)|0]|=b; col[i%9]|=b; caj[((i/27)|0)*3+(((i%9)/3)|0)]|=b; }
  let n=0, sol=null;
  function rec(){
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++) if(!a[i]){
      const r=(i/9)|0,c=i%9,k=((r/3)|0)*3+((c/3)|0);
      const m=511&~(fil[r]|col[c]|caj[k]), cn=pop(m);
      if(cn<bc){bc=cn;best=i;bm=m;if(cn<=1)break;}
    }
    if(best<0){ n++; if(!sol) sol=a.slice(); return n>=lim; }
    if(bc===0) return false;
    const r=(best/9)|0,c=best%9,k=((r/3)|0)*3+((c/3)|0);
    const ds=[]; for(let d=0;d<9;d++) if(bm&(1<<d)) ds.push(d);
    if(azar) for(let i=ds.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ds[i],ds[j]]=[ds[j],ds[i]]; }
    for(const d of ds){
      const b=1<<d; a[best]=d+1; fil[r]|=b; col[c]|=b; caj[k]|=b;
      const fin=rec();
      fil[r]&=~b; col[c]&=~b; caj[k]&=~b; a[best]=0;
      if(fin) return true;
    }
    return false;
  }
  rec(); return {n,sol};
}
/* Dificultad por técnica: Fácil = solo casillas con un único candidato; Medio = además números que solo caben en un sitio de su fila, columna o caja; Difícil = hace falta algo más (pares, parejas ocultas, etc.). */
function soloSimples(g,soloDesnudos){
  const a=g.slice(), cand=new Array(81).fill(0);
  const cands=i=>{ let m=511; for(let j=0;j<81;j++) if(a[j]&&pares(i,j)) m&=~(1<<(a[j]-1)); return m; };
  const unid=[]; for(let r=0;r<9;r++) unid.push([...Array(9).keys()].map(c=>r*9+c)); for(let c=0;c<9;c++) unid.push([...Array(9).keys()].map(r=>r*9+c));
  for(let br=0;br<3;br++) for(let bc=0;bc<3;bc++){ const u=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++) u.push((br*3+r)*9+bc*3+c); unid.push(u); }
  let avance=true;
  while(avance){
    avance=false;
    for(let i=0;i<81;i++) if(!a[i]){ const m=cands(i); cand[i]=m; if(m&&!(m&(m-1))){ a[i]=Math.log2(m)+1; avance=true; } }
    if(avance) continue;
    if(!soloDesnudos){
      for(const u of unid) for(let d=0;d<9;d++){
        if(u.some(i=>a[i]===d+1)) continue;
        const sitios=u.filter(i=>!a[i]&&(cands(i)&(1<<d)));
        if(sitios.length===1){ a[sitios[0]]=d+1; avance=true; }
      }
    }
  }
  return a.every(v=>v);
}
/* Experto: ni siquiera bastan las técnicas intermedias (parejas, tríos, apuntadores y reducción caja-línea). */
function conTecnicas(g,avanzado){
  const v=new Array(81).fill(0), c=new Array(81).fill(511), U=[];
  for(let r=0;r<9;r++) U.push([...Array(9).keys()].map(k=>r*9+k)); for(let k=0;k<9;k++) U.push([...Array(9).keys()].map(r=>r*9+k));
  for(let br=0;br<3;br++) for(let bc=0;bc<3;bc++){ const u=[]; for(let r=0;r<3;r++) for(let k=0;k<3;k++) u.push((br*3+r)*9+bc*3+k); U.push(u); }
  const poner=(i,d)=>{ v[i]=d; c[i]=0; const b=1<<(d-1); for(let j=0;j<81;j++) if(pares(i,j)) c[j]&=~b; };
  for(let i=0;i<81;i++) if(g[i]) poner(i,g[i]);
  const quitar=(i,m)=>{ if(c[i]&m){ c[i]&=~m; return true; } return false; };
  let cambio=true;
  while(cambio){
    cambio=false;
    for(let i=0;i<81;i++){ if(!v[i]&&!c[i]) return false; if(!v[i]&&!(c[i]&(c[i]-1))){ poner(i,Math.log2(c[i])+1); cambio=true; } }
    if(cambio) continue;
    for(const u of U) for(let d=0;d<9;d++){
      if(u.some(i=>v[i]===d+1)) continue;
      const si=u.filter(i=>!v[i]&&(c[i]&(1<<d)));
      if(si.length===1){ poner(si[0],d+1); cambio=true; }
    }
    if(cambio) continue;
    for(const u of U){
      const li=u.filter(i=>!v[i]);
      for(let a=0;a<li.length;a++) for(let b=a+1;b<li.length;b++){
        const m2=c[li[a]]|c[li[b]];
        if(pop(m2)===2) for(const i of li) if(i!==li[a]&&i!==li[b]&&quitar(i,m2)) cambio=true;
        for(let e=b+1;e<li.length;e++){
          const m3=m2|c[li[e]];
          if(pop(m3)===3) for(const i of li) if(i!==li[a]&&i!==li[b]&&i!==li[e]&&quitar(i,m3)) cambio=true;
        }
      }
      for(let d1=0;d1<9;d1++) for(let d2=d1+1;d2<9;d2++){
        const s1=li.filter(i=>c[i]&(1<<d1)), s2=li.filter(i=>c[i]&(1<<d2));
        if(s1.length===2&&s2.length===2&&s1[0]===s2[0]&&s1[1]===s2[1]){ const m=(1<<d1)|(1<<d2); for(const i of s1) if(c[i]&~m){ c[i]&=m; cambio=true; } }
      }
    }
    for(let bi=18;bi<27;bi++) for(let d=0;d<9;d++){
      const si=U[bi].filter(i=>!v[i]&&(c[i]&(1<<d)));
      if(si.length>1){
        if(si.every(i=>fila(i)===fila(si[0]))) for(let k=0;k<9;k++){ const j=fila(si[0])*9+k; if(caja(j)!==bi-18&&!v[j]&&quitar(j,1<<d)) cambio=true; }
        if(si.every(i=>colu(i)===colu(si[0]))) for(let k=0;k<9;k++){ const j=k*9+colu(si[0]); if(caja(j)!==bi-18&&!v[j]&&quitar(j,1<<d)) cambio=true; }
      }
    }
    for(let ui=0;ui<18;ui++) for(let d=0;d<9;d++){
      const si=U[ui].filter(i=>!v[i]&&(c[i]&(1<<d)));
      if(si.length>1&&si.every(i=>caja(i)===caja(si[0]))) for(let j=0;j<81;j++) if(caja(j)===caja(si[0])&&!U[ui].includes(j)&&!v[j]&&quitar(j,1<<d)) cambio=true;
    }
    if(cambio||!avanzado) continue;
    /* X-Wing, Swordfish y Jellyfish (filas y columnas) */
    for(let d=0;d<9;d++) for(const [lin,otra] of [[(k,m)=>k*9+m,(k,m)=>m*9+k],[(k,m)=>m*9+k,(k,m)=>k*9+m]]){
      const pos=[]; for(let k=0;k<9;k++){ const ms=[]; for(let m=0;m<9;m++){ const i=lin(k,m); if(!v[i]&&(c[i]&(1<<d))) ms.push(m); } pos.push(ms); }
      const cand=[...Array(9).keys()].filter(k=>pos[k].length>=2&&pos[k].length<=4);
      const comb=(n,ini,act)=>{
        if(act.length===n){
          const un=new Set(); act.forEach(k=>pos[k].forEach(m=>un.add(m)));
          if(un.size===n) for(const m of un) for(let k=0;k<9;k++) if(!act.includes(k)){ const i=otra(m,k); if(!v[i]&&quitar(i,1<<d)) cambio=true; }
          return;
        }
        for(let t=ini;t<cand.length;t++) comb(n,t+1,act.concat(cand[t]));
      };
      for(let n=2;n<=4;n++) comb(n,0,[]);
    }
    if(cambio) continue;
    /* XY-Wing */
    for(let p=0;p<81;p++){
      if(v[p]||pop(c[p])!==2) continue;
      const ds=[]; for(let d=0;d<9;d++) if(c[p]&(1<<d)) ds.push(d);
      const [x,y]=ds;
      for(let a=0;a<81;a++){ if(!pares(p,a)||v[a]||pop(c[a])!==2||!(c[a]&(1<<x))||(c[a]&(1<<y))) continue;
        const z=Math.log2(c[a]&~(1<<x));
        for(let b=0;b<81;b++){ if(b===a||!pares(p,b)||v[b]||c[b]!==((1<<y)|(1<<z))) continue;
          for(let j=0;j<81;j++) if(j!==a&&j!==b&&!v[j]&&pares(j,a)&&pares(j,b)&&quitar(j,1<<z)) cambio=true;
        }
      }
    }
  }
  return v.every(x=>x);
}
const OBJ={muyfacil:[46,50],facil:[38,42],medio:[30,34],dificil:[24,27],experto:[22,25],maestro:[20,24]};
function generar(nivel){
  let mejor=null; const max=nivel==='maestro'?400:100, t0=Date.now();
  for(let intento=0;intento<max&&Date.now()-t0<14000;intento++){
    const sol=resolver(new Array(81).fill(0),1,true).sol, g=sol.slice();
    const orden=[...Array(81).keys()]; for(let i=80;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [orden[i],orden[j]]=[orden[j],orden[i]]; }

  else if(/^[1-9]$/.test(k)){ poner(+k); e.preventDefault(); }
  else if(k==='Backspace'||k==='Delete'||k==='0'){ borrar(); e.preventDefault(); }
  else if(e.ctrlKey&&k.toLowerCase()==='z'&&!e.shiftKey){ deshacer(); e.preventDefault(); }
  else if(e.ctrlKey&&(k.toLowerCase()==='y'||(k.toLowerCase()==='z'&&e.shiftKey))){ rehacer(); e.preventDefault(); }
  else if(k.startsWith('Arrow')){
    let i=P.sel<0?40:P.sel;
    if(k==='ArrowLeft'&&colu(i)>0) i--; if(k==='ArrowRight'&&colu(i)<8) i++; if(k==='ArrowUp'&&fila(i)>0) i-=9; if(k==='ArrowDown'&&fila(i)<8) i+=9;
    P.sel=i; pintar(); e.preventDefault();
  }
});

iniciar();
sincronizar();
})();
</script>

<script>
/* Actualización automática: compara con version.json y recarga si hay versión nueva */
(function(){
  var BUILD='V2.10', ROOT='../';
  if(/[?&]embed=1/.test(location.search)) return;
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){
    intentos(intentos()+1);
    try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){}
    location.reload();
  }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid #e8a33d;background:#1b1815;color:#efe7db;font:600 15px/1.3 system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4)';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{
      var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){
        if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v);
      } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') comprobar(); });
  setInterval(comprobar,300000);
})();
</script>
