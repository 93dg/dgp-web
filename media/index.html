<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medios">
<title>Medios</title>
<style>
:root{--bg:#0a0c11;--s1:#11141b;--s2:#181c26;--bd:rgba(255,255,255,.09);--tx:#eef0f5;--mut:#98a1b5;--ac:#ffb81c;--pos:#35d39a;--neg:#ff7070;--r:14px}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--s1:#fff;--s2:#f7f8fb;--bd:rgba(15,20,35,.11);--tx:#10131a;--mut:#58627a;--ac:#946100;--pos:#0e7c57;--neg:#c42b2b}}
html.embed{--bg:#12100e;--s1:#1b1815;--s2:#211d19;--bd:#332c25;--tx:#efe7db;--mut:#9c9186;--ac:#e8a33d;--pos:#6fbf9c;--neg:#ff7070}
html.embed body{background:transparent}
html.embed .main{padding:0 0 24px}
html.embed h1,html.embed .main>.m,html.embed .tabs{margin-top:0}
html.embed h1,html.embed .main>.m{display:none}
html.embed .tabs{margin-top:4px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.015em}
h2{margin:0 0 10px;font-size:1.05rem}
.m{color:var(--mut);font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
input,select{width:100%;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font:inherit;margin:0}
button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;padding:9px 6px;cursor:pointer;border-radius:10px}
button:hover:not(:disabled){filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:14px 0 16px}
.tab{flex:1;border:1px solid var(--bd);color:var(--mut);background:var(--s1);font-weight:600;padding:11px 8px;border-radius:12px}
.tab.on{color:var(--tx);border-color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.pick{display:block;border:1px dashed var(--bd);border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--mut)}
.pick:hover,.pick.over{border-color:var(--ac);color:var(--tx)}
.pick input{display:none}
.pick b{display:block;color:var(--tx);margin-bottom:2px}
.go{border:1px solid var(--ac);border-radius:12px;padding:11px 16px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.row>.m{flex:1 1 180px;min-width:0}
.fld{margin-bottom:12px}
.fld label{display:block;margin:0 0 4px}
.bar{height:8px;border-radius:6px;background:var(--s2);border:1px solid var(--bd);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.ok{color:var(--pos)}
.err{color:var(--neg)}
.dl{display:inline-block;border:1px solid var(--pos);color:var(--pos);font-weight:700;border-radius:12px;padding:11px 16px;text-decoration:none;margin-top:8px}
video,audio{width:100%;border-radius:12px;background:#000;max-height:46vh;display:block}
audio{background:transparent}
.tl{position:relative;height:56px;margin:12px 0 6px;border:1px solid var(--bd);border-radius:12px;background:var(--s2);overflow:hidden;touch-action:none;cursor:pointer;user-select:none}
.tl .seg{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--pos) 28%,transparent);border-left:2px solid var(--pos);border-right:2px solid var(--pos)}
.tl .sel{position:absolute;top:0;bottom:0;border:2px solid var(--ac);border-radius:6px;background:color-mix(in srgb,var(--ac) 12%,transparent);pointer-events:none}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);pointer-events:none}
.ticks{display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act button{border:1px solid var(--bd);background:var(--s2);color:var(--tx)}
.act button.pri{border-color:var(--ac);color:var(--ac)}
.tg{border:1px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:12px;padding:9px 14px;font-weight:600}
.tg.on{border-color:var(--ac);color:var(--ac)}
.pl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:10px}
.pl button{border:1px solid var(--ac);border-radius:12px;padding:9px 16px;min-width:112px}
.pl input[type=range]{padding:0;height:28px;border:0;background:none;accent-color:var(--ac)}
.pl .tm{grid-column:1/-1;display:flex;justify-content:space-between}
.lib{margin-top:12px}
.lib .it{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:12px;background:var(--s2);margin-top:6px}
.lib .it.on{border-color:var(--ac)}
.lib .it button.us{flex:1;min-width:0;text-align:left;color:var(--tx);font-weight:600;padding:10px 12px}
.lib .it button.us small{display:block;color:var(--mut);font-weight:400}
.lib .it button.us b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .it button.qt{color:var(--mut);font-weight:600;padding:10px 12px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opt button{border:1px solid var(--bd);background:var(--s2);color:var(--tx);text-align:left;padding:12px;font-weight:600}
.opt button.on{border-color:var(--ac)}
.opt small{display:block;color:var(--mut);font-weight:400}
@media(max-width:520px){.opt{grid-template-columns:1fr}}
input[type=range]{padding:0;height:28px;accent-color:var(--ac);border:0;background:none}
.rg{margin-bottom:10px}.rg .row{justify-content:space-between}
.ajus{border-top:1px solid var(--bd);margin-top:14px;padding-top:12px}
pre{white-space:pre-wrap;font-size:.75rem;color:var(--mut);max-height:160px;overflow:auto}
</style>
</head>
<body>
<div class="main">
  <h1>Medios</h1>
  <div class="m">Todo se procesa en tu dispositivo. Los archivos no se suben a ningún servidor.</div>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabMp3" role="tab">Vídeo a MP3</button>
    <button class="tab" id="tabEd" role="tab">Recortar</button>
  </div>

  <!-- Vídeo a MP3 -->
  <section id="pMp3">
    <div class="card">
      <label class="pick" id="pickMp3"><input type="file" id="fMp3" accept="video/*,audio/*,.mkv,.mov,.avi,.m4a,.webm"><b>Elegir un vídeo</b><span class="m">o arrastrarlo aquí</span></label>
      <div class="lib" id="libMp3"></div>
      <div id="infoMp3" class="m" style="margin-top:10px" hidden></div>
      <div id="prevMp3" style="margin-top:10px"></div>
      <div class="row" id="rowBuc1" style="margin-top:8px" hidden><button class="tg" id="bBuc1" aria-pressed="false">Bucle</button></div>
      <div id="avMp3" class="m"></div>
      <div class="fld" style="margin-top:12px">
        <label class="m" for="kbps">Calidad</label>
        <select id="kbps"><option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="256">256 kbps</option><option value="320">320 kbps</option></select>
      </div>
      <div id="ajMp3"></div>
      <button class="go" id="goMp3" disabled>Convertir a MP3</button>
      <div id="stMp3" class="m" style="margin-top:10px"></div>
      <div class="bar" id="barMp3" hidden><i></i></div>
      <div id="outMp3"></div>
    </div>
  </section>

  <!-- Recortar -->
  <section id="pEd" hidden>
    <div class="card" id="edPick">
      <label class="pick" id="pickEd"><input type="file" id="fEd" accept="video/*,audio/*,.mkv,.mov,.avi,.m4a,.webm"><b>Elegir un vídeo o un audio</b><span class="m">o arrastrarlo aquí</span></label>
      <div class="lib" id="libEd"></div>
    </div>
    <div id="edBody" hidden>
      <div class="card">
        <div id="edName" class="m" style="margin-bottom:8px"></div>
        <div id="media"></div>
        <div class="tl" id="tl" tabindex="0" aria-label="Línea de tiempo"></div>
        <div class="ticks m num"><span id="tPos">0:00,0</span><span id="tDur"></span></div>
        <div class="act">
          <button id="bPlay">Reproducir</button>
          <button id="bUse">Elegir la posición actual</button>
        </div>
        <div class="row" style="margin-top:8px"><button class="tg" id="bBuc" aria-pressed="false">Bucle</button><span class="m" id="bucHelp">Repite el trozo seleccionado, o todo si no hay selección.</span></div>
      </div>
      <div class="card">
        <h2>Trozo seleccionado</h2>
        <div class="two">
          <div class="fld"><label class="m" for="iA">Inicio</label><input id="iA" class="num" inputmode="decimal" autocomplete="off" placeholder="0:00,0"></div>
          <div class="fld"><label class="m" for="iB">Fin</label><input id="iB" class="num" inputmode="decimal" autocomplete="off" placeholder="0:00,0"></div>
        </div>
        <div class="m" id="selHelp">Arrastra sobre la línea de tiempo o escribe los tiempos.</div>
        <div class="act">
          <button id="bCut" class="pri" disabled>Cortar este trozo</button>
          <button id="bKeep" disabled>Quedarme solo con este trozo</button>
        </div>
        <div class="act">
          <button id="bUndo" disabled>Deshacer</button>
          <button id="bRedo" disabled>Rehacer</button>
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b>Resultado</b><span class="m num" id="resDur"></span></div>
        <div id="ajEd"></div>
        <button class="go" id="bSave" style="margin-top:10px">Guardar</button>
        <div id="saveBox" hidden>
          <div class="m" style="margin-top:12px">Guardar como</div>
          <div class="opt">
            <button id="oMp3" class="on">MP3<small>Solo el audio</small></button>
            <button id="oSame">Mismo formato<small id="sameTxt"></small></button>
          </div>
          <button class="go" id="bSave2">Guardar archivo</button>
        </div>
        <div id="stEd" class="m" style="margin-top:10px"></div>
        <div class="bar" id="barEd" hidden><i></i></div>
        <div id="outEd"></div>
      </div>
    </div>
  </section>
  <div class="m" id="diag" style="margin-top:18px;text-align:center;font-size:.75rem"></div>
  <div class="m" style="margin-top:4px;text-align:center"><span id="version">V1.28</span></div>
  <pre id="log" hidden></pre>
</div>

<script>
if(/[?&]embed=1/.test(location.search)){
  document.documentElement.classList.add('embed');
  var __h=function(){ try{ parent.postMessage({medios:Math.ceil(document.body.getBoundingClientRect().height)+8},location.origin); }catch(e){} };
  addEventListener('load',function(){ __h(); new ResizeObserver(__h).observe(document.body); });
}
</script>
<script src="lib/ffmpeg.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

/* ---------- utilidades ---------- */
function fmt(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1).replace('.',','); }
function parseT(v){
  v=String(v||'').trim().replace(',','.'); if(!v) return NaN;
  const p=v.split(':'); let t=0; for(const x of p){ const n=parseFloat(x); if(isNaN(n)) return NaN; t=t*60+n; } return t;
}
function mb(n){ return (n/1048576).toLocaleString('es-ES',{maximumFractionDigits:1})+' MB'; }
function baseName(n){ return n.replace(/\.[^.]+$/,''); }
function extOf(n){ const m=/\.([^.]+)$/.exec(n); return m?m[1].toLowerCase():''; }
function setBar(id,p){ const b=$(id); b.hidden=false; b.firstElementChild.style.width=Math.max(0,Math.min(100,p*100))+'%'; }

/* ---------- motor (ffmpeg en el navegador) ---------- */
let ff=null, ffLoading=null, logLines=[], curStatus=null, curBar=null;
async function motor(setStatus){
  if(ff) return ff;
  if(ffLoading) return ffLoading;
  ffLoading=(async()=>{
    setStatus('Preparando el motor de conversión. Solo tarda la primera vez.');
    const f=new FFmpegWASM.FFmpeg();
    f.on('log',({message})=>{ logLines.push(message); if(logLines.length>400) logLines.shift(); });
    f.on('progress',({progress})=>{ if(curBar && progress>=0 && progress<=1) setBar(curBar,progress); });
    const base=new URL('lib/',location.href).href;
    await f.load({coreURL:base+'ffmpeg-core.js',wasmURL:base+'ffmpeg-core.wasm'});
    ff=f; return f;
  })();
  try{ return await ffLoading; }catch(e){ ffLoading=null; throw e; }
}
async function reiniciarMotor(){ try{ if(ff) ff.terminate(); }catch(e){} ff=null; ffLoading=null; }

async function leerArchivo(file){ return new Uint8Array(await file.arrayBuffer()); }
async function sondear(f,nombre){
  logLines=[];
  try{ await f.exec(['-hide_banner','-i',nombre]); }catch(e){}
  const t=logLines.join('\n');
  return {video:/Stream #\d+:\d+.*: Video:(?!.*attached pic)/.test(t), audio:/Stream #\d+:\d+.*: Audio:/.test(t)};
}
function descargar(blob,nombre,box,etq){
  const url=URL.createObjectURL(blob);
  box.innerHTML='';
  const a=document.createElement('a');
  a.className='dl'; a.href=url; a.download=nombre; a.textContent=etq+' ('+mb(blob.size)+')';
  box.appendChild(a);
  const nm=document.createElement('div'); nm.className='m'; nm.style.marginTop='6px'; nm.textContent=nombre; box.appendChild(nm);
  a.click();
}
function arrastrar(zona,input){
  ['dragenter','dragover'].forEach(e=>zona.addEventListener(e,ev=>{ev.preventDefault();zona.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>zona.addEventListener(e,ev=>{ev.preventDefault();zona.classList.remove('over');}));
  zona.addEventListener('drop',ev=>{ const f=ev.dataTransfer.files[0]; if(f){ const dt=new DataTransfer(); dt.items.add(f); input.files=dt.files; input.dispatchEvent(new Event('change')); } });
}



/* ---------- reproductor propio ---------- */
function reproductor(el,cont){
  cont.innerHTML='';
  const w=document.createElement('div'); w.className='pl';
  const b=document.createElement('button'); b.textContent='Reproducir';
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=1000; r.value=0; r.setAttribute('aria-label','Posición');
  const t=document.createElement('div'); t.className='tm m num'; t.innerHTML='<span>0:00,0</span><span>0:00,0</span>';
  w.appendChild(b); w.appendChild(r); w.appendChild(t); cont.appendChild(w);
  let arrastra=false;
  const pinta=()=>{ const d=el.duration||0; if(!arrastra&&d) r.value=Math.round(el.currentTime/d*1000); t.children[0].textContent=fmt(el.currentTime); t.children[1].textContent=fmt(d); };
  b.onclick=()=>{ if(el.paused){ if(el.ended||el.currentTime>=(el.duration||0)-0.05) el.currentTime=0; el.play(); } else el.pause(); };
  r.addEventListener('input',()=>{ arrastra=true; const d=el.duration||0; el.currentTime=r.value/1000*d; t.children[0].textContent=fmt(el.currentTime); });
  r.addEventListener('change',()=>{ arrastra=false; });
  ['timeupdate','loadedmetadata','durationchange','seeked'].forEach(e=>el.addEventListener(e,pinta));
  el.addEventListener('play',()=>{ b.textContent='Pausa'; }); el.addEventListener('pause',()=>{ b.textContent='Reproducir'; }); el.addEventListener('ended',()=>{ b.textContent='Reproducir'; });
  pinta();
}

/* ---------- tono y velocidad ---------- */
function ajustesUI(caja,alCambiar){
  caja.className='ajus';
  caja.innerHTML='<div class="rg"><div class="row"><label class="m">Tono</label><span class="num" data-v="t">0 semitonos</span></div><input type="range" min="-12" max="12" step="1" value="0" data-r="t"><div class="row m"><span>Más grave</span><span>Más agudo</span></div></div>'+
    '<div class="rg"><div class="row"><label class="m">Velocidad</label><span class="num" data-v="v">100 %</span></div><input type="range" min="50" max="200" step="5" value="100" data-r="v"><div class="row m"><span>Más lento</span><span>Más rápido</span></div></div>'+
    '<button data-r0="1">Restablecer</button>';
  const T=caja.querySelector('[data-r=t]'), V=caja.querySelector('[data-r=v]');
  const pt=caja.querySelector('[data-v=t]'), pv=caja.querySelector('[data-v=v]');
  const act=()=>{ const t=+T.value; pt.textContent=(t>0?'+':'')+t+(Math.abs(t)===1?' semitono':' semitonos'); pv.textContent=V.value+' %'; if(alCambiar) alCambiar(); };
  T.oninput=act; V.oninput=act;
  caja.querySelector('[data-r0]').onclick=()=>{ T.value=0; V.value=100; act(); };
  const poner=(t,v,sin)=>{ T.value=t; V.value=Math.round(v*100); const c=alCambiar; if(sin){ alCambiar=null; } act(); alCambiar=c; };
  return {poner,get semis(){return +T.value;}, get vel(){return +V.value/100;}, get activo(){return +T.value!==0||+V.value!==100;}};
}
/* cadena de filtros de audio: tono sin cambiar la velocidad, y velocidad sin cambiar el tono */
function filtroAudio(semis,vel){
  const p=Math.pow(2,semis/12), out=[];
  if(semis!==0){ out.push('aresample=44100','asetrate='+(44100*p).toFixed(2),'aresample=44100'); }
  let r=vel/(semis!==0?p:1);
  while(r>2.0001){ out.push('atempo=2.0'); r/=2; }
  while(r<0.4999){ out.push('atempo=0.5'); r/=0.5; }
  if(Math.abs(r-1)>0.0005) out.push('atempo='+r.toFixed(5));
  return out.join(',');
}


let ctxA=null;
function desbloquear(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{
    if(!ctxA) ctxA=new (window.AudioContext||window.webkitAudioContext)();
    if(ctxA.state!=='running') ctxA.resume();
    const b=ctxA.createBuffer(1,1,22050), n=ctxA.createBufferSource(); n.buffer=b; n.connect(ctxA.destination); n.start(0);
  }catch(e){}
}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,desbloquear,{passive:true}));
/* ---------- escucha previa con tono y velocidad en directo ----------
   El sonido del propio reproductor pasa por un procesador en el hilo de audio (AudioWorklet).
   No se decodifica el archivo ni se sincroniza nada a mano: las pausas y saltos del reproductor valen tal cual. */
function crearPrev(el,file,getP,avisar){
  let st=null, fuente=null, an=null, montando=null, fallo=false, mod=null;
  let sinSenal=0, reparaciones=0, ultRep=0, an_buf=null;
  const ctx=()=>{ if(!ctxA) ctxA=new (window.AudioContext||window.webkitAudioContext)(); return ctxA; };
  function conectarNodo(){
    const c=ctx(), n=new mod.SoundTouchNode({context:c});
    fuente.connect(n); n.connect(c.destination);
    an=c.createAnalyser(); an.fftSize=1024; an_buf=new Float32Array(an.fftSize); n.connect(an);
    st=n;
  }
  async function montar(){
    if(st||fallo) return;
    if(montando) return montando;
    montando=(async()=>{
      try{
        avisar('Preparando la escucha con el tono aplicado.');
        const c=ctx(); try{ await c.resume(); }catch(e){}
        mod=await import('./lib/soundtouch-node.js');
        if(!c.__stReg){ await mod.SoundTouchNode.register(c,new URL('lib/soundtouch-processor.js',location.href).href); c.__stReg=true; }
        fuente=c.createMediaElementSource(el);
        conectarNodo();
        avisar('');
      }catch(e){
        fallo=true; try{ if(fuente) fuente.connect(ctx().destination); }catch(e2){}
        avisar('No se puede escuchar el tono con este navegador ('+((e&&e.message)||'error')+'). Se aplicará igualmente al guardar.');
      }
    })();
    await montando; montando=null;
  }
  function parametros(){
    const p=getP();
    el.preservesPitch=false; el.webkitPreservesPitch=false; el.mozPreservesPitch=false;
    el.playbackRate=p.vel;
    if(st){ st.playbackRate.value=p.vel; st.pitch.value=Math.pow(2,p.semis/12); }
  }
  async function aplicar(){
    const p=getP();
    if(!st && !fallo && p.semis!==0) await montar();
    if(st) parametros();
    else{ el.preservesPitch=true; el.webkitPreservesPitch=true; el.playbackRate=p.vel; }
    if(st && ctxA && ctxA.state!=='running'){ try{ await ctxA.resume(); }catch(e){} }
  }
  /* Vigilancia: si debería sonar y no sale señal, se repara sola (nuevo procesador, reanudar audio y reproductor) */
  function reparar(motivo){
    const ahora=Date.now(); if(ahora-ultRep<4000) return; ultRep=ahora; reparaciones++;
    try{ if(ctxA&&ctxA.state!=='running') ctxA.resume(); }catch(e){}
    try{ if(st){ st.disconnect(); } if(an){ an.disconnect(); } fuente.disconnect(); conectarNodo(); parametros(); }catch(e){}
    try{ if(!el.paused&&el.readyState<3){ const t=el.currentTime; el.currentTime=t; } }catch(e){}
    sinSenal=0;
  }
  setInterval(()=>{
    const d=document.getElementById('diag'); if(!d||!st) return;
    const sonando=!el.paused&&!el.ended;

/* ---------- archivos guardados en la app (IndexedDB) ---------- */
const BD=(function(){
  let db=null;
  function abrir(){
    if(db) return Promise.resolve(db);
    return new Promise((ok,ko)=>{
      const r=indexedDB.open('medios',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('archivos',{keyPath:'id'}); };
      r.onsuccess=()=>{ db=r.result; ok(db); }; r.onerror=()=>ko(r.error);
    });
  }
  async function tx(modo,fn){
    const d=await abrir();
    return new Promise((ok,ko)=>{ const t=d.transaction('archivos',modo); const st=t.objectStore('archivos'); const rq=fn(st); t.oncomplete=()=>ok(rq&&rq.result); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error); });
  }
  return {
    todos:()=>tx('readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>y.fecha-x.fecha)),
    get:id=>tx('readonly',s=>s.get(id)),
    poner:rec=>tx('readwrite',s=>s.put(rec)),
    quitar:id=>tx('readwrite',s=>s.delete(id))
  };
})();
const MAXN=8, MAXB=900*1048576;

async function guardarArchivo(f){
  try{
    const id=idDe(f); const prev=await BD.get(id);
    await BD.poner({id,name:f.name,type:f.type,size:f.size,fecha:Date.now(),blob:f,ajustes:(prev&&prev.ajustes)||{}});
    let l=await BD.todos(), tot=0;
    for(let i=0;i<l.length;i++){ tot+=l[i].size; if(i>=MAXN||tot>MAXB){ if(l[i].id!==id) await BD.quitar(l[i].id); } }
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    pintarLib(); return id;
  }catch(e){ return null; }
}

(function(){
  const tl=$('tl'); let down=null, moved=false;
  const tAt=ev=>{ const r=tl.getBoundingClientRect(); return Math.max(0,Math.min(dur,(ev.clientX-r.left)/r.width*dur)); };
  tl.addEventListener('pointerdown',ev=>{ if(!el) return; tl.setPointerCapture(ev.pointerId); down=tAt(ev); moved=false; });
  tl.addEventListener('pointermove',ev=>{
    if(down===null) return; const t=tAt(ev);
    if(!moved && Math.abs(t-down)/dur*tl.getBoundingClientRect().width<5) return;
    moved=true; sel=[Math.min(down,t),Math.max(down,t)]; refrescar();
  });
  tl.addEventListener('pointerup',ev=>{
    if(down===null) return; const t=tAt(ev);
    if(!moved){ el.currentTime=t; sel=null; refrescar(); moverPh(); }
    down=null;
  });
  tl.addEventListener('keydown',ev=>{ if(!el) return; if(ev.key==='ArrowLeft'){ el.currentTime=Math.max(0,el.currentTime-(ev.shiftKey?5:1)); moverPh(); ev.preventDefault(); } if(ev.key==='ArrowRight'){ el.currentTime=Math.min(dur,el.currentTime+(ev.shiftKey?5:1)); moverPh(); ev.preventDefault(); } });

$('bSave2').onclick=async()=>{

    const sd=await sondear(f,entrada);

    const mp3=destino==='mp3'; const ext=mp3?'mp3':fm.ext;
    const conVideo=!mp3 && sd.video && ['mp4','webm'].includes(ext);
    const conAudio=sd.audio;
    if(!conAudio && !conVideo) throw new Error('El archivo no tiene audio que guardar.');
    // filtros: un trozo por cada tramo conservado y unión en orden

      else if(ext==='ogg'||ext==='webm') args.push('-c:a','libvorbis','-q:a','5');

<script>
/* Actualización automática: compara con version.json y recarga si hay versión nueva */
(function(){
  var BUILD='V1.28', ROOT='../';
  if(/[?&]embed=1/.test(location.search)) return;
  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){
    intentos(intentos()+1);
    try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){}
    location.reload();
  }
  function aviso(v){
    if(document.getElementById('dgpUpd')) return;
    var d=document.createElement('div'); d.id='dgpUpd'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid #e8a33d;background:#1b1815;color:#efe7db;font:600 15px/1.3 system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4)';
    d.innerHTML='<span>Hay una versión nueva ('+v+')</span><button style="background:none;border:0;color:#e8a33d;font:inherit;font-weight:700;padding:8px 4px;cursor:pointer">Actualizar</button>';
    d.querySelector('button').onclick=function(){ intentos(0); recargar(); };
    document.body.appendChild(d);
  }
  async function comprobar(){
    if(busy) return; busy=true;
    try{
      var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json();
      if(j&&j.v&&j.v!==BUILD){
        if(Date.now()-t0<8000 && intentos()<2) recargar(); else aviso(j.v);
      } else intentos(0);
    }catch(e){}
    busy=false;
  }
  comprobar();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') comprobar(); });
  setInterval(comprobar,300000);
})();
</script>
