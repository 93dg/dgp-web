<style>

button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--s2);border:1px solid var(--bd);border-radius:10px;min-height:38px;padding:0 12px;cursor:pointer}
button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);background:rgba(255,184,28,.12)}

.top button{min-height:36px;padding:0 10px}

.herr button.on{color:var(--ac);border-color:var(--ac);background:rgba(255,184,28,.1)}

.zoom button{width:40px;padding:0;background:rgba(23,26,34,.92)}

<script>

/* ---------- datos ---------- */
function planoNuevo(){ return {id:uid(),nombre:'Plano nuevo',w:1600,h:1100,fondo:null,fop:.6,muros:[],
  circ:[{id:'c1',nom:'C1',desc:'10A · 1,5 mm²',col:'#b07a4a'},{id:'c2',nom:'C2',desc:'16A · 2,5 mm²',col:'#ff2bbf'},{id:'n',nom:'Neutro',desc:'',col:'#3f7cf2'}],
  els:[],cab:[],act:Date.now()}; }
let PL=[], P=null;
try{ PL=JSON.parse(localStorage.getItem('dgp-planos')||'[]'); }catch(e){}
let actId=null; try{ actId=localStorage.getItem('dgp-planos-act'); }catch(e){}

async function cab(){ try{ if(!sbc) return null; const {data:{session}}=await sbc.auth.getSession(); return session?{apikey:KEY,Authorization:'Bearer '+session.access_token}:null; }catch(e){ return null; } }

  const h=Object.assign({'Accept-Profile':'personal','Content-Profile':'personal','Content-Type':'application/json'},H,opt.h||{});
  try{ const r=await fetch(URL0+'/rest/v1/'+path,{method:opt.m||'GET',headers:h,body:opt.b?JSON.stringify(opt.b):undefined}); if(!r.ok) return null; const t=await r.text(); return t?JSON.parse(t):[]; }catch(e){ return null; } }
let tG=0;
function guarda(){ P.act=Date.now(); try{ localStorage.setItem('dgp-planos',JSON.stringify(PL)); localStorage.setItem('dgp-planos-act',P.id); }catch(e){}
  clearTimeout(tG); tG=setTimeout(()=>api('ui_estado?on_conflict=clave',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{clave:'planos_electricos',valor:PL,actualizado:new Date().toISOString()}}),1200); }
async function cargaSrv(){  const r=await api('ui_estado?clave=eq.planos_electricos&select=valor'); if(r&&r[0]&&Array.isArray(r[0].valor)&&r[0].valor.length){
  const srv=r[0].valor, loc=new Map(PL.map(x=>[x.id,x]));
  srv.forEach(x=>{ const l=loc.get(x.id); if(!l||(x.act||0)>(l.act||0)) loc.set(x.id,x); }); PL=[...loc.values()]; P=PL.find(x=>x.id===P.id)||PL[0]; pinta(); ajustar(); } }

/* ---------- deshacer ---------- */
let HIST=[], REDO=[]; function snap(){ HIST.push(JSON.stringify(P)); if(HIST.length>60) HIST.shift(); REDO=[]; }
function rehacer(){ if(!REDO.length) return; HIST.push(JSON.stringify(P)); const o=JSON.parse(REDO.pop()); const i=PL.findIndex(x=>x.id===o.id); PL[i]=o; P=o; SEL=null; guarda(); pinta(); }
function deshacer(){ if(!HIST.length) return; REDO.push(JSON.stringify(P)); const o=JSON.parse(HIST.pop()); const i=PL.findIndex(x=>x.id===o.id); PL[i]=o; P=o; SEL=null; guarda(); pinta(); }

/* ---------- herramientas ---------- */
const IC={
 mover:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>',
 muro:'<svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" fill="currentColor"/></svg>',
 cable:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 20V8h10V4h7"/><path d="M17 1l3 3-3 3"/></svg>',
 caja:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" fill="currentColor" opacity=".8"/></svg>',
 luz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
 int:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="16" r="3.2"/><path d="M10.3 13.7L19 5M16 3l4.5 4.5"/></svg>',
 ench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9a7 7 0 0 0 14 0M12 16v6M3 9h18"/></svg>',
 vent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 12c0-5 4-6 5-4s-2 4-5 4zM12 12c4 3 3 7 1 7s-3-4-1-7zM12 12c-4 2-8 0-7-2s5-1 7 2z"/></svg>',
 cuadro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8"/></svg>',
 texto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5h14M12 5v15"/></svg>',
 borrar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'};
const HERR=[['mover','Mover'],['cable','Cable'],['caja','Caja'],['luz','Bombilla'],['int','Interruptor'],['ench','Enchufe'],['vent','Ventilador'],['cuadro','Cuadro'],['tv','TV / Red'],['texto','Texto'],['muro','Muro'],['borrar','Borrar']];
let CORR=false, VSEL=null; let MODO='mover', CIRC=P.circ[0]&&P.circ[0].id, SEL=null, DIB=null, ORTO=true, FIL=null;
try{ ORTO=localStorage.getItem('dgp-planos-orto')!=='0'; }catch(e){}

/* ---------- vista (zoom y desplazamiento) ---------- */
const svg=$('svg'), vista=$('vista');
let VX=0,VY=0,VS=1;
function aplicaVista(){ vista.setAttribute('transform','translate('+VX+' '+VY+') scale('+VS+')'); }
function ajustar(){ const r=$('lienzo').getBoundingClientRect(); const s=Math.min(r.width/(P.w+40),r.height/(P.h+40)); VS=s; VX=(r.width-P.w*s)/2; VY=(r.height-P.h*s)/2; aplicaVista(); }
function zoomEn(f,cx,cy){ const r=$('lienzo').getBoundingClientRect(); if(cx==null){ cx=r.width/2; cy=r.height/2; } const ns=Math.max(.1,Math.min(8,VS*f)); VX=cx-(cx-VX)*ns/VS; VY=cy-(cy-VY)*ns/VS; VS=ns; aplicaVista(); }
function aPlano(e){ const r=svg.getBoundingClientRect(); return {x:(e.clientX-r.left-VX)/VS, y:(e.clientY-r.top-VY)/VS}; }
const rej=v=>Math.round(v/5)*5;

/* ---------- dibujo ---------- */
const colDe=id=>{ const c=P.circ.find(x=>x.id===id); return c?c.col:'#888'; };
function marcadores(){ const cols=[...new Set(P.circ.map(c=>c.col))]; $('defs').innerHTML='<pattern id="cuad" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#e8e8ec" stroke-width="1"/></pattern>'+
  cols.map(c=>'<marker id="m'+c.slice(1)+'" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+c+'"/></marker>').join(''); }
function simb(el){ const t=el.t, k='#111';
  switch(t){
   case 'luz': return '<circle r="13" fill="#fff" stroke="'+k+'" stroke-width="2.4"/><path d="M-9-9L9 9M9-9L-9 9" stroke="'+k+'" stroke-width="2.4"/>';
   case 'int': return '<circle cx="-6" cy="6" r="5" fill="#fff" stroke="'+k+'" stroke-width="2.4"/><path d="M-2.5 2.5L10-10M6-14l8 8" stroke="'+k+'" stroke-width="2.4" fill="none"/>';
   case 'ench': return '<path d="M-11-3a11 11 0 0 0 22 0M0 8v10M-13-3h26" stroke="'+k+'" stroke-width="2.4" fill="none"/>'+(el.n>1?'<path d="M17-3a8 8 0 0 0 16 0M25 5v13M15-3h20" stroke="'+k+'" stroke-width="2.4" fill="none" transform="translate(-6 0)"/>':'');
   case 'vent': return '<circle r="22" fill="#fff" stroke="'+k+'" stroke-width="2.2"/><g fill="none" stroke="'+k+'" stroke-width="2"><path d="M0 0c0-11 9-14 11-9S5 0 0 0z"/><path d="M0 0c9 6 7 15 2 15S-3 6 0 0z"/><path d="M0 0c-9 5-18 1-16-4S-4-3 0 0z"/></g><circle r="2.5" fill="'+k+'"/>';
   case 'cuadro': return '<rect x="-20" y="-26" width="40" height="52" rx="3" fill="#fff" stroke="'+k+'" stroke-width="2.4"/><path d="M-12-14h24M-12-4h24M-12 6h24M-12 16h14" stroke="'+k+'" stroke-width="2"/>';
   case 'tv': return '<rect x="-13" y="-13" width="26" height="26" rx="2" fill="#fff" stroke="#e11ea8" stroke-width="3"/><rect x="-7" y="-7" width="14" height="14" fill="none" stroke="'+k+'" stroke-width="1.6"/><path d="M-4-1h8M-4 3h8" stroke="'+k+'" stroke-width="1.4"/>';
   case 'caja': { const L=cajaLin(el), b=caja2(el), w=b.w, h=b.h;
     return '<rect x="'+(-w/2)+'" y="'+(-h/2)+'" width="'+w+'" height="'+h+'" rx="3" fill="#3b3f47" stroke="#26292f" stroke-width="2"/>'+L.map((l,i)=>'<text x="0" y="'+(-h/2+21+i*20)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+l.col+'" font-family="Inter,Arial,sans-serif">'+esc(l.t)+'</text>').join(''); }
   case 'texto': return '<text x="0" y="5" text-anchor="middle" font-size="'+(el.fs||18)+'" fill="'+(el.col||'#111')+'" font-family="Inter,Arial,sans-serif" font-weight="600">'+esc(el.txt||'Texto')+'</text>';
  } return ''; }
function cajaLin(el){ const M={}; P.cab.forEach(c=>{ if(c.a===el.id||c.b===el.id) M[c.c]=(M[c.c]||0)+1; });
  return P.circ.filter(c=>M[c.id]).map(c=>({t:c.nom+' - '+M[c.id],col:c.col})); }
function caja2(el){ if(el.t!=='caja') return null; const L=cajaLin(el); return {w:Math.max(70,...L.map(l=>l.t.length*8+20)),h:Math.max(40,L.length*20+14)}; }
function radio(el){ if(!el) return 0; const b=caja2(el); if(b) return Math.max(b.w,b.h)*1.3/2*0+ (b.h*1.3/2+6); return el.t==='vent'?42:el.t==='cuadro'?48:26; }
function semi(el){ const k=(el.t==='caja'||el.t==='texto'?1.3:1.7)*(el.sc||1), b=caja2(el); if(b) return [(b.w/2)*k,(b.h/2)*k]; const r=(el.t==='vent'?22:el.t==='cuadro'?26:14)*k; return [r,r]; }
function puerto(el,sd){ const [w,h]=semi(el); return sd==='t'?[el.x,el.y-h]:sd==='b'?[el.x,el.y+h]:sd==='l'?[el.x-w,el.y]:[el.x+w,el.y]; }
function hueco(el,sd,c){ const L=P.cab.filter(k=>(k.a===el.id&&k.pa===sd)||(k.b===el.id&&k.pb===sd)).sort((x,y)=>P.circ.findIndex(q=>q.id===x.c)-P.circ.findIndex(q=>q.id===y.c)||(x.ret?1:0)-(y.ret?1:0)||(x.id<y.id?-1:1));
  const n=L.length; if(n<2) return 0; const [w,h]=semi(el); const lado=(sd==='t'||sd==='b')?w:h; const sp=Math.min(14,(2*lado*.85)/(n-1)); return (L.indexOf(c)-(n-1)/2)*sp; }
function conPuerto(p,i,el,sd,c){ const o=c?hueco(el,sd,c):0; let Q=puerto(el,sd); Q=(sd==='t'||sd==='b')?[Q[0]+o,Q[1]]:[Q[0],Q[1]+o]; const d=28, S=sd==='t'?[Q[0],Q[1]-d]:sd==='b'?[Q[0],Q[1]+d]:sd==='l'?[Q[0]-d,Q[1]]:[Q[0]+d,Q[1]];
  const N=i===0?p[1]:p[p.length-2]; const C=(sd==='t'||sd==='b')?[N[0],S[1]]:[S[0],N[1]];
  const ins=[C,S,Q]; if(i===0){ p.splice(0,1,...ins.reverse()); } else { p.splice(p.length-1,1,...ins); } return p; }
function ptsVis(c){ let p=c.pts.map(q=>q.slice()); if(p.length<2) return p;
  const eb=c.b&&c.pb?P.els.find(x=>x.id===c.b):null, ea=c.a&&c.pa?P.els.find(x=>x.id===c.a):null;
  if(eb) p=conPuerto(p,1,eb,c.pb,c); if(ea) p=conPuerto(p,0,ea,c.pa,c); if(eb&&ea) return p;
  const n=p.length-1;
  const cut=(i,j,r)=>{ const dx=p[i][0]-p[j][0], dy=p[i][1]-p[j][1], L=Math.hypot(dx,dy); if(L>r+2){ p[i]=[p[j][0]+dx*(L-r)/L,p[j][1]+dy*(L-r)/L]; } };
  if(c.b&&!eb) cut(n,n-1,radio(P.els.find(x=>x.id===c.b)));
  if(c.a&&!ea){ const e2=P.els.find(x=>x.id===c.a); if(e2&&e2.t!=='caja'&&e2.t!=='cuadro') cut(0,1,radio(e2)); }
  return p; }
function sigue(el){ P.cab.forEach(c=>{ const n=c.pts.length-1; if(c.a===el.id) mueveFin(c,0,1,el); if(c.b===el.id) mueveFin(c,n,n-1,el); }); }
function mueveFin(c,i,j,el){ const o=c.pts[i], nb=c.pts[j]; if(nb&&j!==i){ if(Math.abs(nb[0]-o[0])<1&&Math.abs(nb[1]-o[1])>=1) nb[0]=el.x; else if(Math.abs(nb[1]-o[1])<1) nb[1]=el.y; } c.pts[i]=[el.x,el.y]; }
const esCaja=el=>el&&(el.t==='caja'||el.t==='cuadro');
function ladoAuto(el,N){ const dx=N[0]-el.x, dy=N[1]-el.y; return Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'b':'t'); }

const PTR=new Map(); let ARR=null, PINCH=null, MOV=false;
function hit(e){ const t=e.target.closest&&e.target.closest('[data-k]'); return t?{k:t.dataset.k,id:t.dataset.id,i:t.dataset.i!=null?+t.dataset.i:null,w:t.dataset.w,s:t.dataset.s}:null; }
function ortoPt(prev,p){ if(!ORTO||!prev) return p; return Math.abs(p[0]-prev[0])>Math.abs(p[1]-prev[1])?[p[0],prev[1]]:[prev[0],p[1]]; }
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.size===2){ const [a,b]=[...PTR.values()]; PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,vx:VX,vy:VY,vs:VS}; ARR=null; if(DIB&&DIB.muro) DIB=null; return; }
  const p=aPlano(e), h=hit(e); MOV=false;
  if(h&&h.k==='pt'){ const c=P.cab.find(x=>x.id===h.id); if(c){ snap(); const k=h.w==='a'?'pa':'pb'; c[k]=h.s; guarda(); pinta(); } return; }
  if(h&&h.k==='rz'){ const el=P.els.find(x=>x.id===h.id); snap(); ARR={tipo:'rz',id:h.id,d0:Math.max(8,Math.hypot(p.x-el.x,p.y-el.y)),s0:el.sc||1}; return; }
  if(MODO==='mover'){
    if(h&&h.k==='v'){ snap(); VSEL=h.i; ARR={tipo:'v',id:h.id,i:h.i}; pinta(); return; }
    if(h&&(h.k==='e'||h.k==='c'||h.k==='m')){ if(!SEL||SEL.id!==h.id) VSEL=null; SEL={k:h.k,id:h.id}; snap(); ARR={tipo:'obj',k:h.k,id:h.id,x0:p.x,y0:p.y,orig:JSON.stringify(h.k==='e'?P.els.find(x=>x.id===h.id):h.k==='c'?P.cab.find(x=>x.id===h.id):P.muros.find(x=>x.id===h.id))}; pinta(); return; }
    ARR={tipo:'pan',sx:e.clientX,sy:e.clientY,vx:VX,vy:VY,desel:true}; return; }
  if(MODO==='muro'){ const q=[rej(p.x),rej(p.y)]; DIB={muro:{x1:q[0],y1:q[1],x2:q[0],y2:q[1]}}; ARR={tipo:'muro'}; return; }
  ARR={tipo:'tap',sx:e.clientX,sy:e.clientY,vx:VX,vy:VY,p,h}; });
svg.addEventListener('pointermove',e=>{ if(!PTR.has(e.pointerId)) return; PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PINCH&&PTR.size>=2){ const [a,b]=[...PTR.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2, r=svg.getBoundingClientRect();
    const ns=Math.max(.1,Math.min(8,PINCH.vs*d/PINCH.d)); const px=PINCH.cx-r.left, py=PINCH.cy-r.top;
    VX=px-(px-PINCH.vx)*ns/PINCH.vs+(cx-PINCH.cx); VY=py-(py-PINCH.vy)*ns/PINCH.vs+(cy-PINCH.cy); VS=ns; aplicaVista(); return; }

  const p=aPlano(e);
  if(ARR.tipo==='pan'||ARR.tipo==='tap'){ const dx=e.clientX-ARR.sx, dy=e.clientY-ARR.sy; if(Math.hypot(dx,dy)>6){ MOV=true; if(ARR.tipo==='tap') ARR={tipo:'pan',sx:ARR.sx,sy:ARR.sy,vx:ARR.vx,vy:ARR.vy}; VX=ARR.vx+dx; VY=ARR.vy+dy; aplicaVista(); } return; }
  if(ARR.tipo==='muro'){ const m=DIB.muro; let q=[rej(p.x),rej(p.y)]; q=ortoPt([m.x1,m.y1],q); m.x2=q[0]; m.y2=q[1]; pinta(); return; }
  if(ARR.tipo==='rz'){ const el=P.els.find(x=>x.id===ARR.id); el.sc=Math.max(.3,Math.min(4,ARR.s0*Math.hypot(p.x-el.x,p.y-el.y)/ARR.d0)); MOV=true; pinta(); return; }

  if(ARR.tipo==='obj'){ const dx=rej(p.x-ARR.x0), dy=rej(p.y-ARR.y0); if(!dx&&!dy) return; MOV=true; const o=JSON.parse(ARR.orig);
    if(ARR.k==='e'){ const el=P.els.find(x=>x.id===ARR.id); el.x=o.x+dx; el.y=o.y+dy; sigue(el); }
    else if(ARR.k==='c'){ const c=P.cab.find(x=>x.id===ARR.id); c.pts=o.pts.map(q=>[q[0]+dx,q[1]+dy]); }
    else { const m=P.muros.find(x=>x.id===ARR.id); m.x1=o.x1+dx; m.y1=o.y1+dy; m.x2=o.x2+dx; m.y2=o.y2+dy; }
    pinta(); } });
function fin(e){ PTR.delete(e.pointerId); if(PINCH){ if(PTR.size<2) PINCH=null; ARR=null; return; } const A=ARR; ARR=null; if(!A) return;
  if(A.tipo==='pan'){ if(A.desel&&!MOV&&SEL){ SEL=null; pinta(); } return; }
  if(A.tipo==='muro'){ const m=DIB.muro; DIB=null; if(Math.hypot(m.x2-m.x1,m.y2-m.y1)>10){ snap(); P.muros.push(Object.assign({id:uid(),g:18},m)); guarda(); } pinta(); return; }
  if(A.tipo==='v'||A.tipo==='obj'||A.tipo==='rz'){ if(MOV) guarda(); else HIST.pop(); return; }
  if(A.tipo==='tap'){ const p=A.p, h=A.h, q=[rej(p.x),rej(p.y)];
    if(MODO==='borrar'){ if(h&&h.k!=='v'){ snap(); if(h.k==='e'){ P.els=P.els.filter(x=>x.id!==h.id); P.cab.forEach(c=>{ if(c.a===h.id) c.a=null; if(c.b===h.id) c.b=null; }); } else if(h.k==='c') P.cab=P.cab.filter(x=>x.id!==h.id); else P.muros=P.muros.filter(x=>x.id!==h.id); guarda(); pinta(); } return; }
    if(MODO==='cable'){ if(!CIRC){ abreCirc(); return; } if(!DIB) DIB={c:CIRC,pts:[]};
      const prev=DIB.pts[DIB.pts.length-1]; const he=h&&h.k==='e'?P.els.find(x=>x.id===h.id):null;
      if(he){ const t=[he.x,he.y]; if(!prev){ DIB.a=he.id; DIB.pts.push(t); pinta(); return; }
        if(he.id===DIB.a) return; if(ORTO&&prev[0]!==t[0]&&prev[1]!==t[1]) DIB.pts.push([t[0],prev[1]]); DIB.pts.push(t); DIB.b=he.id; pinta(); eligeTipo(); return; }
      if(!prev){ aviso('Empieza tocando un aparato o una caja'); return; }
      const nq=ortoPt(prev,q);
      if(prev&&Math.hypot(nq[0]-prev[0],nq[1]-prev[1])<8){ terminaCable(); return; }
      DIB.pts.push(nq); DIB.cur=null; pinta(); return; }
    if(['caja','luz','int','ench','vent','cuadro','tv','texto'].includes(MODO)){ snap(); const el={id:uid(),t:MODO,x:q[0],y:q[1],r:0};
      
      if(MODO==='texto') el.txt='Texto';
      P.els.push(el); SEL={k:'e',id:el.id}; guarda(); pinta(); if(MODO==='texto') editaTexto(el); return; } } }

function eligeTipo(){ hoja('<h3>Conectar</h3><div class="campo"><label>Circuito</label><div class="fila">'+P.circ.map(c=>'<button class="chip'+(c.id===DIB.c?' on':'')+'" data-tc="'+c.id+'"><i style="background:'+c.col+'"></i>'+esc(c.nom)+'</button>').join('')+'</div></div>'+
  '<div class="campo"><label>Tipo de cable</label><div class="fila"><button class="chip on" data-tt="n">Normal</button><button class="chip" data-tt="r">Retorno (interruptor → bombilla)</button></div></div>'+
  '<div class="fila"><button class="pri" id="tcOk" style="flex:1">Conectar</button><button id="tcX">Cancelar</button></div>');
  let tipo='n';

    if(b.dataset.tc){ DIB.c=b.dataset.tc; CIRC=DIB.c; document.querySelectorAll('[data-tc]').forEach(x=>x.classList.toggle('on',x===b)); return; }

  if(DIB&&DIB.pts){ DIB.c=c; CIRC=c; pinta(); return; }

  else if(a==='orto'){ ORTO=!ORTO; try{ localStorage.setItem('dgp-planos-orto',ORTO?'1':'0'); }catch(e){} pinta(); }
  else if(a==='nosel'){ SEL=null; pinta(); }
  else if(a==='del'){ snap(); if(SEL.k==='e') P.els=P.els.filter(x=>x.id!==SEL.id); else if(SEL.k==='c') P.cab=P.cab.filter(x=>x.id!==SEL.id); else P.muros=P.muros.filter(x=>x.id!==SEL.id); SEL=null; guarda(); pinta(); }

    else if(a==='doble'){ snap(); el.n=el.n>1?1:2; } else if(a==='edit'){ editaTexto(el); return; } guarda(); pinta(); }
  else if(SEL&&SEL.k==='c'){ const c=P.cab.find(x=>x.id===SEL.id); if(!c) return;
    if(a==='av'){ snap(); let bi=0,bl=-1; for(let i=0;i<c.pts.length-1;i++){ const L=Math.hypot(c.pts[i+1][0]-c.pts[i][0],c.pts[i+1][1]-c.pts[i][1]); if(L>bl){ bl=L; bi=i; } } const A=c.pts[bi],B=c.pts[bi+1]; c.pts.splice(bi+1,0,[rej((A[0]+B[0])/2),rej((A[1]+B[1])/2)]); VSEL=bi+1; }
    else if(a==='qv'){ if(VSEL!=null&&VSEL>0&&VSEL<c.pts.length-1||(!c.a&&VSEL===0&&c.pts.length>2)||(!c.b&&VSEL===c.pts.length-1&&c.pts.length>2)){ snap(); c.pts.splice(VSEL,1); } VSEL=null; }
    else if(a==='ret'){ snap(); c.ret=!c.ret; } else if(a==='flecha'){ snap(); c.fl=c.fl===false; } else if(a==='grueso'){ snap(); c.g=c.g>=8?3:(c.g||4)+2; } else if(a==='ccol'){ aviso('Toca arriba el térmico que quieras para este cable'); return; } guarda(); pinta(); } };

   '<div class="fila"><button class="pri" id="cOk" style="flex:1">Guardar</button>'+(nuevo?'':'<button id="cDel" style="color:var(--neg)">Borrar</button>')+'<button id="cX">Cancelar</button></div>');

function editaTexto(el){ hoja('<h3>'+(el.t==='caja'?'Texto de la caja':'Texto')+'</h3>'+(el.t==='caja'?'<div class="meta" style="margin-bottom:6px">Una línea por circuito. Por ejemplo: C1 - 3 x 1.5</div>':'')+

$('bPlanos').onclick=()=>{ hoja('<h3>Planos</h3><div class="campo"><label>Nombre del plano abierto</label><input id="pNom" value="'+esc(P.nombre||'')+'" maxlength="60"></div><div class="lista">'+PL.slice().sort((a,b)=>(b.act||0)-(a.act||0)).map(x=>'<div class="it"><b>'+esc(x.nombre)+'</b><span class="meta">'+new Date(x.act||Date.now()).toLocaleDateString('es-ES')+'</span><button data-ab="'+x.id+'"'+(x.id===P.id?' class="on"':'')+'>'+(x.id===P.id?'Abierto':'Abrir')+'</button><button data-cp="'+x.id+'">Copiar</button>'+(PL.length>1?'<button data-bo="'+x.id+'" style="color:var(--neg)">Borrar</button>':'')+'</div>').join('')+'</div><div class="fila" style="margin-top:12px"><button class="pri" id="pNuevo" style="flex:1">+ Plano nuevo</button><button id="pX">Cerrar</button></div>');
  $('pNom').onchange=()=>{ const v=$('pNom').value.trim(); if(v){ P.nombre=v; guarda(); pinta(); } };
  $('hoja').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.id==='pX'||0){ const v=$('pNom').value.trim(); if(v&&v!==P.nombre){ P.nombre=v; guarda(); pinta(); } cierra(); }
    if(b.id==='pNuevo'){ const n=planoNuevo(); PL.push(n); P=n; HIST=[]; SEL=null; CIRC=n.circ[0].id; guarda(); cierra(); pinta(); ajustar(); }
    if(b.dataset.ab){ P=PL.find(x=>x.id===b.dataset.ab); HIST=[]; SEL=null; CIRC=P.circ[0]&&P.circ[0].id; guarda(); cierra(); pinta(); ajustar(); }
    if(b.dataset.cp){ const o=JSON.parse(JSON.stringify(PL.find(x=>x.id===b.dataset.cp))); o.id=uid(); o.nombre+=' (copia)'; PL.push(o); guarda(); $('bPlanos').onclick(); }
    if(b.dataset.bo){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='¿Seguro?'; return; } PL=PL.filter(x=>x.id!==b.dataset.bo); if(P.id===b.dataset.bo){ P=PL[0]; pinta(); ajustar(); } guarda(); $('bPlanos').onclick(); } }; };
$('bMas').onclick=()=>{ hoja('<h3>Plano</h3>'+
  '<div class="campo"><label>Plano de fondo (foto o captura de la casa)</label><div class="fila"><label style="position:relative;overflow:hidden;display:inline-flex"><span class="pri" style="display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;background:var(--ac);color:#111;font-weight:600">'+(P.fondo?'Cambiar fondo':'Poner fondo')+'</span><input type="file" accept="image/*" id="fFile" style="position:absolute;inset:0;opacity:0;font-size:40px"></label>'+(P.fondo?'<button id="fQuitar">Quitar fondo</button>':'')+'</div></div>'+
  (P.fondo?'<div class="campo"><label>Transparencia del fondo</label><input type="range" id="fOp" min="0.1" max="1" step="0.05" value="'+P.fop+'"></div>':'')+
  '<div class="fila"><div class="campo" style="flex:1"><label>Ancho</label><input type="number" id="pW" value="'+P.w+'"></div><div class="campo" style="flex:1"><label>Alto</label><input type="number" id="pH" value="'+P.h+'"></div></div>'+
  '<div class="fila" style="margin-bottom:10px"><button id="xPng" class="pri" style="flex:1">Descargar imagen</button><button id="xSvg">SVG</button></div>'+
  '<div class="fila" style="margin-bottom:10px"><button id="mCp" style="flex:1">Copiar este plano</button><button id="mBo" style="flex:1;color:var(--neg)">Borrar este plano</button></div><div class="fila"><button id="mX" style="flex:1">Cerrar</button></div>');
  $('fFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const M=2000, k=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      snap(); const s=Math.min(1,1600/c.width); P.fondo={src:c.toDataURL('image/jpeg',.82),w:Math.round(c.width*s*(1600/Math.max(c.width*s,1))),h:0}; P.fondo.w=1600; P.fondo.h=Math.round(c.height*1600/c.width); P.w=1600; P.h=Math.max(P.h,P.fondo.h); guarda(); cierra(); pinta(); ajustar(); }; im.src=r.result; }; r.readAsDataURL(f); };
  if($('fOp')) $('fOp').oninput=e=>{ P.fop=+e.target.value; pinta(); }, $('fOp').onchange=()=>guarda();
  $('pW').onchange=$('pH').onchange=()=>{ snap(); P.w=Math.max(400,+$('pW').value||1600); P.h=Math.max(300,+$('pH').value||1100); guarda(); pinta(); ajustar(); };
  $('hoja').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.id==='mCp'){ const o=JSON.parse(JSON.stringify(P)); o.id=uid(); o.nombre+=' (copia)'; PL.push(o); P=o; HIST=[]; REDO=[]; guarda(); cierra(); pinta(); ajustar(); return; }
    if(b.id==='mBo'){ if(PL.length<2){ b.textContent='Es el único plano'; return; } if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='¿Seguro? Toca otra vez'; return; } PL=PL.filter(x=>x.id!==P.id); P=PL[0]; HIST=[]; REDO=[]; guarda(); cierra(); pinta(); ajustar(); return; }
    if(b.id==='mX') cierra(); if(b.id==='fQuitar'){ snap(); P.fondo=null; guarda(); cierra(); pinta(); }
    if(b.id==='xSvg') descarga(new Blob([svgTexto()],{type:'image/svg+xml'}),(P.nombre||'plano')+'.svg');
    if(b.id==='xPng') exportaPng(); }; };
function svgTexto(){ const sel=SEL; SEL=null; pinta(); const g=vista.innerHTML; SEL=sel; pinta();
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+P.w+' '+P.h+'" width="'+P.w+'" height="'+P.h+'"><defs>'+$('defs').innerHTML+'</defs>'+g.replace(/fill="url\(#cuad\)"/,'fill="none"')+'</svg>'; }
function exportaPng(){ const t=svgTexto(), im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'), k=2; c.width=P.w*k; c.height=P.h*k; const x=c.getContext('2d'); x.scale(k,k); x.drawImage(im,0,0); c.toBlob(b=>descarga(b,(P.nombre||'plano')+'.png'),'image/png'); };
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t); }
function descarga(blob,nombre){ const f=new File([blob],nombre,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:nombre}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

async function plantillas(){ let hecho=false; try{ hecho=localStorage.getItem('dgp-planos-pl3')==='1'; }catch(e){} if(hecho) return;
  try{ const r=await fetch('plantillas.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const L=await r.json();
    PL=PL.filter(x=>x.els.length||x.cab.length||x.muros.length||x.fondo);
    L.forEach(x=>{ const i=PL.findIndex(y=>y.id===x.id); if(i<0) PL.push(x); else if(!PL[i].act||PL[i].act<=1795600000000) PL[i]=x; else { x.id=x.id+'-v2'; x.nombre+=' (nuevo)'; if(!PL.some(y=>y.id===x.id)) PL.push(x); } }); P=PL.find(x=>x.id===L[0].id+'-v2')||PL.find(x=>x.id===L[0].id)||PL[0]; CIRC=P.circ[0]&&P.circ[0].id;
    try{ localStorage.setItem('dgp-planos-pl3','1'); }catch(e){} guarda(); pinta(); ajustar(); }catch(e){} }
function addRetornos(Q){ let n=0; Q.els.filter(e=>e.t==='int').forEach(it=>{ if(Q.cab.some(c=>c.ret&&(c.a===it.id||c.b===it.id))) return;
    const f=Q.cab.find(c=>c.b===it.id&&!c.ret); if(!f||!f.a) return; const pts=f.pts.slice().reverse().map(p=>[p[0]+8,p[1]+8]);
    Q.cab.push({id:uid(),c:f.c,pts,fl:true,g:3,a:it.id,b:f.a,ret:true}); n++; }); return n; }
function arreglaCuadro(Q){ let n=0; Q.cab.forEach(c=>{ const ea=Q.els.find(x=>x.id===c.a); if(ea&&ea.t==='cuadro'&&c.pts.length>2&&Math.abs(c.pts[1][1]-c.pts[0][1])<1&&Math.abs(c.pts[1][0]-c.pts[0][0])>0){ c.pts.splice(1,1); c.pa=null; n++; } }); return n; }
function encadena(Q){ const cu=Q.els.find(e=>e.t==='cuadro'); if(!cu) return 0; const tr=Q.cab.filter(c=>c.a===cu.id&&!c.ret); if(!tr.length) return 0;
  const porC={}; tr.forEach(c=>{ const b=Q.els.find(e=>e.id===c.b); if(b&&b.t==='caja') (porC[c.c]=porC[c.c]||[]).push(b); });
  Q.cab=Q.cab.filter(c=>!(c.a===cu.id&&!c.ret&&porC[c.c]));
  Object.keys(porC).forEach(ci=>{ let pend=porC[ci].slice(), cur=cu, k=0; const off=(Q.circ.findIndex(x=>x.id===ci)-3)*6;
    while(pend.length){ pend.sort((a,b)=>Math.hypot(a.x-cur.x,a.y-cur.y)-Math.hypot(b.x-cur.x,b.y-cur.y)); const nx=pend.shift();
      const pts=Math.abs(nx.x-cur.x)<2||Math.abs(nx.y-cur.y)<2?[[cur.x,cur.y],[nx.x,nx.y]]:[[cur.x,cur.y],[cur.x+(k?0:off),nx.y+off],[nx.x,nx.y+off],[nx.x,nx.y]];
      Q.cab.push({id:uid(),c:ci,pts,fl:true,g:3,a:cur.id,b:nx.id}); cur=nx; k++; } });
  return 1; }
function retMismoCamino(Q){ let n=0; Q.cab.filter(c=>c.ret).forEach(c=>{ const f=Q.cab.find(k=>!k.ret&&((k.a===c.b&&k.b===c.a)||(k.a===c.a&&k.b===c.b))); if(f){ c.pts=f.a===c.a?f.pts.map(p=>p.slice()):f.pts.slice().reverse().map(p=>p.slice()); c.pa=null; c.pb=null; n++; } }); return n; }
function migraRet(){ let h2=false; try{ h2=localStorage.getItem('dgp-planos-enc1')==='1'; }catch(e){} if(!h2){ let n3=0; PL.filter(x=>/^pl-(baja|alta)/.test(x.id)).forEach(x=>{ n3+=encadena(x)+retMismoCamino(x); }); try{ localStorage.setItem('dgp-planos-enc1','1'); }catch(e){} if(n3){ guarda(); pinta(); } } let n2=0; PL.forEach(x=>{ n2+=arreglaCuadro(x); }); if(n2) guarda(); let hecho=false; try{ hecho=localStorage.getItem('dgp-planos-ret1')==='1'; }catch(e){} if(hecho) return; let n=0;
  PL.filter(x=>/^pl-(baja|alta)/.test(x.id)).forEach(x=>{ n+=addRetornos(x); }); try{ localStorage.setItem('dgp-planos-ret1','1'); }catch(e){} if(n){ guarda(); pinta(); } }
pinta(); requestAnimationFrame(ajustar); cargaSrv().then(plantillas).then(migraRet);
})();

<script>
(function(){

  var VJ=new URL(ROOT+'version.json',location.href).href, t0=Date.now(), busy=false;
  function intentos(n){ try{ if(n===undefined) return +(sessionStorage.getItem('dgp_upd')||0); sessionStorage.setItem('dgp_upd',n); }catch(e){ return 0; } }
  async function recargar(){ intentos(intentos()+1); try{ await fetch(location.href.split('#')[0],{cache:'reload'}); }catch(e){} location.reload(); }
  async function comprobar(){ if(busy) return; busy=true;
    try{ var r=await fetch(VJ+'?t='+Date.now(),{cache:'no-store'}); var j=await r.json(); if(j&&j.v&&j.v!==BUILD){ if(Date.now()-t0<8000 && intentos()<2) recargar(); } else intentos(0); }catch(e){}
    busy=false; }
  comprobar(); document.addEventListener('visibilitychange',function(){ if(!document.hidden) comprobar(); });
})();
