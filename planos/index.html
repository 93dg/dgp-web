function norm(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function circPor(f){ return P.circ.find(c=>f(norm(c.desc)+' '+norm(c.nom))); }
function sugiereCirc(A,B){ const fin=[A,B].filter(e=>e&&!esCaja(e)&&e.t!=='cuadro'&&e.t!=='subida');
  for(const e of fin){ const l=norm(e.lab);
    if(e.t==='luz'||e.t==='int'||e.t==='vent'){ const c=circPor(d=>/ilumin|luz/.test(d)); if(c) return c.id; }
    const pares=[[/placa|horno|vitro|induc/,/placa|horno/],[/lavadora|lavavaj/,/lavadora|lavavaj/],[/secadora/,/secadora/],[/aerot/,/aerot/],[/a\/a|aire|clima/,/aire|a\/a|clima/],[/cocina|bano|aseo/,/cocina|bano/]];
    for(const [rl,rc] of pares) if(rl.test(l)){ const c=circPor(d=>rc.test(d)); if(c) return c.id; }
    if(e.t==='ench'||e.t==='tv'){ const c=circPor(d=>/enchufes generales|general|tomas/.test(d))||circPor(d=>/enchuf/.test(d)); if(c) return c.id; } }
  for(const e of [A,B]){ if(!e) continue; const k=P.cab.find(c=>!c.ret&&(c.a===e.id||c.b===e.id)); if(k) return k.c; }
  return CIRC||(P.circ.find(c=>/^C\d/.test(c.nom))||P.circ[0]).id; }
function conToque(h){ const okE=id=>{ const el=P.els.find(x=>x.id===id); return el&&el.t!=='mueble'&&el.t!=='texto'; };
  if(h&&h.k==='cp'&&CON){ if(CON.st==='pa'){ CON.pa=h.s; CON.st='b'; pinta(); return; }
    if(CON.st==='pb'){ CON.pb=h.s; const A=P.els.find(x=>x.id===CON.a), B=P.els.find(x=>x.id===CON.b), qa=puerto(A,CON.pa), qb=puerto(B,CON.pb);
      const pts=[qa]; if(qa[0]!==qb[0]&&qa[1]!==qb[1]) pts.push((CON.pa==='t'||CON.pa==='b')?[qa[0],qb[1]]:[qb[0],qa[1]]); pts.push(qb);
      DIB={c:sugiereCirc(A,B),sug:sugiereCirc(A,B),pts,a:CON.a,b:CON.b,pa:CON.pa,pb:CON.pb}; CON=null; pinta(); eligeTipo(); return; } }
  if(h&&h.k==='e'&&okE(h.id)){ if(!CON||CON.st==='pa'&&h.id!==CON.a){ CON={a:h.id,st:'pa'}; }
    else if(CON.st==='b'&&h.id!==CON.a){ CON.b=h.id; CON.st='pb'; } pinta(); return; } }
function terminaCable(){ if(DIB&&DIB.pts&&DIB.pts.length>1){ snap(); P.cab.push(Object.assign({id:uid(),c:DIB.c,pts:DIB.pts,fl:true,g:4,a:DIB.a||null,b:DIB.b||null,ret:!!DIB.ret},DIB.pa?{pa:DIB.pa,pb:DIB.pb}:{})); sentido(P.cab[P.cab.length-1]); guarda(); } DIB=null; if(MODO==='cable') MODO='mover'; pinta(); }

  if(c==='sel'){ hoja('<h3>Térmicos</h3><div style="display:flex;flex-direction:column;gap:6px"><button data-f="*" style="justify-content:flex-start;'+(!FIL?'border-color:var(--ac);color:var(--ac)':'')+'">Todos los térmicos</button>'+P.circ.map(c=>'<div style="display:flex;gap:6px"><button data-f="'+c.id+'" style="flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-start;'+(FIL===c.id?'border-color:'+c.col:'')+'"><i style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+c.col+'"></i><b style="color:'+c.col+'">'+esc(c.nom)+'</b><span class="meta">'+esc(c.desc||'')+'</span></button><button data-ed="'+c.id+'" aria-label="Editar" style="width:48px">✎</button></div>').join('')+'<button data-f="+">+ Añadir térmico</button></div>');

  if(c==='mob'){ MODO=MODO==='mueble'?'mover':'mueble'; SEL=null; CON=null; pinta(); return; } if(c==='*'){ FIL=null; pinta(); return; } if(c==='corr'){ togCorr(); return; }
  if(SEL&&SEL.k==='c'){ snap(); const k=P.cab.find(x=>x.id===SEL.id); if(k) k.c=c; CIRC=c; guarda(); pinta(); return; }
  if(DIB&&DIB.pts){ DIB.c=c; CIRC=c; pinta(); return; }
  if(FIL===c){ abreCirc(P.circ.find(x=>x.id===c)); return; }
  FIL=c; CIRC=c; pinta(); };

  if(a==='verr'&&SEL){ const rr=revisa().filter(r=>r.id===SEL.id); hoja('<h3>Problema</h3>'+rr.map(r=>'<p style="display:flex;gap:10px;align-items:flex-start"><span style="color:'+(r.g===2?'#ef4444':'#f59e0b')+'">'+(r.g===2?'●':'▲')+'</span>'+esc(r.t)+'</p>').join('')+'<button id="veX" style="width:100%">Cerrar</button>'); $('veX').onclick=cierra; return; }
  if(a==='conec'&&SEL){ CON={a:SEL.id,st:'pa'}; SEL=null; MODO='cable'; pinta(); return; }

  else if(a==='orto'){ ORTO=!ORTO; try{ localStorage.setItem('dgp-planos-orto',ORTO?'1':'0'); }catch(e){} pinta(); }

  else if(a==='del'){ snap(); if(SEL.k==='e') P.els=P.els.filter(x=>x.id!==SEL.id); else if(SEL.k==='c') P.cab=P.cab.filter(x=>x.id!==SEL.id); else P.muros=P.muros.filter(x=>x.id!==SEL.id); SEL=null; guarda(); pinta(); }
  else if(SEL&&SEL.k==='e'){ const el=P.els.find(x=>x.id===SEL.id); if(!el) return;

    if(a==='lab'){ hoja('<h3>Nombre del aparato</h3><div class="campo"><input id="lTxt" value="'+esc(el.lab||'')+'" placeholder="Ej. Aire acondicionado, Aerotermia, Placa" maxlength="30"></div><div class="fila"><button class="pri" id="lOk" style="flex:1">Guardar</button><button id="lX">Cancelar</button></div>'); setTimeout(()=>$('lTxt').focus(),60); $('hoja').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(b.id==='lX') cierra(); if(b.id==='lOk'){ snap(); el.lab=$('lTxt').value.trim(); guarda(); cierra(); pinta(); } }; return; }
    if(a==='mas'||a==='menos'){ snap(); el.sc=Math.max(.3,Math.min(4,(el.sc||1)*(a==='mas'?1.2:1/1.2))); } else if(a==='rot'){ snap(); const c0=choca(el), r0=el.r; el.r=((el.r||0)+90)%360; if(choca(el)>c0+2){ el.r=r0; aviso('No cabe: chocaría con un muro'); } } else if(a==='dup'){ snap(); const n=Object.assign({},el,{id:uid(),x:el.x+40,y:el.y+40}); P.els.push(n); SEL={k:'e',id:n.id}; }
    else if(a==='doble'){ snap(); el.n=el.n>1?1:2; } else if(a==='edit'){ editaTexto(el); return; } guarda(); pinta(); }
  else if(SEL&&SEL.k==='c'){ const c=P.cab.find(x=>x.id===SEL.id); if(!c) return;
    if(a==='av'){ snap(); let bi=0,bl=-1; for(let i=0;i<c.pts.length-1;i++){ const L=Math.hypot(c.pts[i+1][0]-c.pts[i][0],c.pts[i+1][1]-c.pts[i][1]); if(L>bl){ bl=L; bi=i; } } const A=c.pts[bi],B=c.pts[bi+1]; c.pts.splice(bi+1,0,[rej((A[0]+B[0])/2),rej((A[1]+B[1])/2)]); VSEL=bi+1; }

$('velo').onclick=cierra;

  $('hoja').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;

function cuadroSVG(){

  return '<h3>Cuadro</h3><p style="font-size:13px;opacity:.75;margin:4px 0 8px">Toca un circuito para resaltar su cableado. Marrón = fase · Azul = neutro · Verde-amarillo = tierra.</p><div id="qWrap" style="overflow:auto;background:#fff;border-radius:12px;touch-action:pan-x pan-y"><svg id="qSvg" viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto">'+g+'</svg></div>'+
   '<p style="font-size:13px;opacity:.8">La salida del IGA entra por abajo en la protección de sobretensiones y en cada diferencial. El peine va enchufado arriba, directamente en el diferencial y en sus térmicos (máx. 5). Cada térmico saca fase y neutro de su circuito; la tierra de cada circuito va directa al borne.</p>';
}

(function(){
